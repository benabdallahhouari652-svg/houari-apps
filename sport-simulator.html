 const an=S.mode=='match'?'':`<div class="card"><h3>تحليل القرار</h3><p><b>قرارك:</b> ${o?o[0]:'لا قرار'}</p><p><b>النتيجة:</b> ${OUT[n]}</p><p><b>لماذا؟</b> ${why}</p>
 <p><b>عوامل القرار:</b> ${sc.cu?'':`المسافة ${p.d} م · السرعة ${SP[p.s]} · الضغط ${PR[p.pr]} · `}الزمن ${lim?lim+' ث':'مفتوح'}</p><p><b>المهارة المرتبطة:</b> ${sc.sk}</p>
 <p><b>القرار البديل:</b> ${best!=i?b[0]+(b[4]?' — '+b[4]:''):'قرارك هو الأنسب هنا ✅'}${ok.length?`<br>قرارات مقبولة أيضًا: ${ok.join('، ')}`:''}</p><p><b>ملاحظة تدريبية:</b> ${sc.tip}</p></div>`;
 R(`<div class="mt">موقف ${S.i+1}/${S.q.length}</div><h2>${sc.n}</h2>${PT}<div class="ob n${n}">${OUT[n]}</div>
 <div class="chips"><button class="ch" onclick="play(${i},1.4,0)">▶️ تشغيل / إعادة</button><button class="ch" onclick="play(${i},4,0)">🐢 Slow Motion</button><button class="ch" onclick="play(${i},1.4,1)">📍 المسار ونقطة القرار</button>${best!=i?`<button class="ch" onclick="play(${best},1.4,1)">⚖️ مقارنة بالقرار البديل</button>`:''}</div>${an}
 <button class="b" onclick="S.i++;next()">${S.i+1>=S.q.length?'عرض التقرير':'الموقف التالي'}</button>`);
 setup(sc.init(p));play(i,1.4,0)}
function report(){const r=S.res,N=r.length,tm=r.filter(x=>x.lim);
 const weak=r.filter(x=>x.n<2).map(x=>byId(x.id));
 R(`<h2>${S.mode=='match'?'MATCH DECISION REPORT':'تقرير الجلسة'}</h2>${bar('🧠 اتخاذ القرار',avg(r.map(x=>x.n))/3*100)}${tm.length?bar('⚡ سرعة الاستجابة',avg(tm.map(x=>1-x.t/x.lim))*100):''}${bar('🎯 توافق مع القرار الأنسب',r.filter(x=>x.opt).length/N*100)}
 <div class="card">${r.map((x,i)=>`<div class="row"><span>${i+1}. ${byId(x.id).n}</span><span>${['🔴','🟠','🟡','🟢'][x.n]}</span><span>${x.lim?x.t+' ث':'—'}</span></div>`).join('')}</div>
 ${weak.length?`<div class="card"><b>مهارات مرتبطة بالمواقف الأقل ملاءمة:</b><br>${[...new Set(weak.map(w=>w.sk))].join('، ')}</div>`:'<div class="card">🟢 قرارات ملائمة في جميع المواقف.</div>'}
 <div class="chips"><button class="b" onclick="start()">🔄 جلسة جديدة</button><button class="ch" onclick="perf()">📊 MY PERFORMANCE</button><button class="ch" onclick="home()">الرئيسية</button></div>`)}
function perf(){const a=ld();
 if(!a.length)return R(`<h2>MY PERFORMANCE</h2><div class="card">لا توجد محاولات بعد. ابدأ جلسة تدريب لتظهر إحصائياتك هنا.</div><button class="b" onclick="home()">ابدأ التدريب</button>`);
 const tm=a.filter(x=>x.lim),per={};a.forEach(x=>(per[x.id]=per[x.id]||[]).push(x));const last=a[a.length-1];
 const wk=Object.entries(per).map(([id,v])=>[id,v.filter(x=>x.n<2).length]).filter(w=>w[1]>=2).sort((x,y)=>y[1]-x[1])[0];
 R(`<h2>MY PERFORMANCE</h2><div class="card"><div class="row"><span>الفئة</span><b>${last.age}</b></div><div class="row"><span>المركز</span><b>${last.role=='g'?'حارس مرمى':'لاعب'}</b></div><div class="row"><span>عدد السيناريوهات</span><b>${Object.keys(per).length}</b></div><div class="row"><span>عدد المحاولات</span><b>${a.length}</b></div><div class="row"><span>متوسط زمن القرار</span><b>${tm.length?avg(tm.map(x=>x.t)).toFixed(1)+' ث':'—'}</b></div><div class="row"><span>القرارات الناجحة</span><b>${a.filter(x=>x.n>=2).length}</b></div></div>
 <h3>متوسط الأداء لكل موقف</h3>${Object.entries(per).map(([id,v])=>bar(byId(id).n,avg(v.map(x=>x.n))/3*100)).join('')}
 ${wk?`<div class="card"><b>ملاحظة تدريبية</b><br>تكرر لديك هذا النوع من القرار: «${byId(wk[0]).n}».<br><b>اقتراح تدريبي:</b> جرّب مجموعة مواقف مركزة على هذا النوع من القرار.<br><br><button class="b" onclick="focus('${wk[0]}')">تدريب مركّز</button></div>`:''}
 <div class="chips"><button class="ch" onclick="home()">الرئيسية</button><button class="ch" onclick="sv([]);perf()">مسح الإحصائيات</button></div>`)}
function about(){R(`<h2><span class="fl">🇩🇿</span> SPORT SIMULATOR.DZ</h2><div class="card"><p>منصة لمحاكاة وتدريب القرار الرياضي. السؤال ليس فقط: كيف تؤدي المهارة؟ بل: متى تستخدمها؟ ولماذا؟ وما القرار المناسب لهذا الموقف؟</p><p><b>المربي الرياضي ومدرب الحراس بن عبد الله الهواري</b><br>مؤسس ومطور المشروع</p></div><button class="b" onclick="home()">الرئيسية</button>`)}
let CU=[];try{CU=JSON.parse(localStorage.getItem('ssdz_cu')||'[]')}catch(e){}
const svc=()=>{try{localStorage.setItem('ssdz_cu',JSON.stringify(CU))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sel=(id,items,v)=>`<select id="${id}">${items.map(x=>`<option value="${x[1]}"${x[1]==v?' selected':''}>${x[0]}</option>`).join('')}</select>`;
function mk(c){const g=c.role=='g';return{id:'c'+c.id,cu:1,role:c.role,n:c.n,sk:c.sk||'مهارة مخصصة',tip:c.tip||'سيناريو أنشأه المدرب.',gen:()=>({d:0,s:2,pr:2}),txt:()=>c.txt,
 init:()=>g?{me:[97,32],opp:[80,30],ball:[82,30]}:{me:[50,32],ball:[50,32],opp:[58,32],mate:[62,16],gk:[97,32]},od:[4,0],
 O:c.O.map(o=>[o.l,()=>o.q,g?.5:[8,0],o.r,o.r,g?undefined:'c'])}}
function cOpts(){const r=$('#cr').value,pool=[...(r=='g'?G:P),...CU.filter(c=>c.role==r).map(mk)];$('#cs').innerHTML='<option value="all">كل المواقف (عشوائي)</option>'+pool.map(s=>`<option value="${s.id}">${s.n}</option>`).join('')}
function coach(){R(`<button class="lk" onclick="home()">→ الرئيسية</button><h2>👨‍🏫 COACH MODE</h2><div class="card"><h3>إعداد جلسة</h3>
<label>الرياضة</label><select disabled><option>⚽ كرة القدم</option></select>
<label>المركز</label>${sel('cr',[['🧤 حارس مرمى','g'],['⚽ لاعب','p']],S.role||'g')}
<label>الفئة</label>${sel('ca',AGES,S.age)}<label>الصعوبة</label>${sel('cl',LVS,S.lvl)}
<label>نوع الموقف</label><select id="cs"></select>
<label>الوقت لكل قرار (ثانية)</label><input id="ct" type="number" min="2" max="15" value="4">
<label>عدد المواقف</label><input id="cn" type="number" min="1" max="20" value="5"><br><br><button class="b" onclick="cStart()">ابدأ الجلسة</button></div>
<div class="card"><h3>سيناريوهاتي</h3>${CU.length?CU.map(c=>`<div class="row"><span>${c.role=='g'?'🧤':'⚽'} ${esc(c.n)}</span><span><button class="lk" onclick="cPlay(${c.id})">▶</button><button class="lk" onclick="cEdit(${c.id})">✏️</button><button class="lk" onclick="cDel(${c.id})">🗑</button></span></div>`).join(''):'<p class="mt">لم تنشئ سيناريوهات بعد.</p>'}<br><button class="b" onclick="cEdit()">➕ إنشاء سيناريو</button></div>`);
 $('#cr').onchange=cOpts;cOpts()}
function cStart(){const r=$('#cr').value,v=$('#cs').value,n=Math.max(1,Math.min(20,+$('#cn').value||5));
 S.role=r;S.age=$('#ca').value;S.lvl=$('#cl').value;S.mode='test';S.sec=Math.max(2,Math.min(15,+$('#ct').value||4));
 const pool=[...(r=='g'?G:P),...CU.filter(c=>c.role==r).map(mk)];let q=[];
 if(v=='all'){while(q.length<n)q.push(...[...pool].sort(()=>Math.random()-.5));q=q.slice(0,n)}else q=Array(n).fill(byId(v));
 start(q)}
function cPlay(id){const c=CU.find(x=>x.id==id);S.role=c.role;S.mode='learn';S.sec=0;start([mk(c)])}
function cDel(id){CU=CU.filter(c=>c.id!=id);svc();coach()}
function cEdit(id){const ex=CU.find(x=>x.id==id),c=ex||{id:Date.now(),role:'g',n:'',txt:'',sk:'',tip:'',O:[]};
 const Q=[['3 — الأنسب',3],['2 — مقبول',2],['1 — أقل ملاءمة',1],['0 — خاطئ',0]];
 R(`<button class="lk" onclick="coach()">→ رجوع</button><h2>${ex?'عزل وتعديل':'إنشاء'} سيناريو</h2><div class="card">
<label>المركز</label>${sel('er',[['🧤 حارس مرمى','g'],['⚽ لاعب','p']],c.role)}
<label>عنوان الموقف</label><input id="en" value="${esc(c.n)}">
<label>وصف الموقف</label><textarea id="et" rows="3">${esc(c.txt)}</textarea>
<label>المهارة المرتبطة</label><input id="es" value="${esc(c.sk)}">
<label>ملاحظة تدريبية</label><input id="ei" value="${esc(c.tip)}">
${[0,1,2,3].map(i=>{const o=c.O[i]||{l:'',q:i?0:3,r:''};return`<div class="card"><b>الخيار ${i+1}</b><input id="ol${i}" placeholder="نص القرار" value="${esc(o.l)}">${sel('oq'+i,Q,o.q)}<input id="or${i}" placeholder="سبب التقييم" value="${esc(o.r)}"></div>`}).join('')}
<div id="eer" style="color:var(--rd)"></div><button class="b" onclick="cSave(${c.id})">💾 حفظ السيناريو</button></div>`)}
function cSave(id){const O=[0,1,2,3].map(i=>({l:$('#ol'+i).value.trim(),q:+$('#oq'+i).value,r:$('#or'+i).value.trim()})).filter(o=>o.l);
 const c={id,role:$('#er').value,n:$('#en').value.trim(),txt:$('#et').value.trim(),sk:$('#es').value.trim(),tip:$('#ei').value.trim(),O};
 const e=!c.n||!c.txt?'أدخل عنوان الموقف ووصفه.':O.length<2?'أضف خيارين على الأقل.':!O.some(o=>o.q==3)?'حدّد خيارًا واحدًا على الأقل كالأنسب (3).':'';
 if(e){$('#eer').textContent=e;return}
 const k=CU.findIndex(x=>x.id==id);k<0?CU.push(c):CU[k]=c;svc();coach()}
home();
</script>
</body>
</html>
