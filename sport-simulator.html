<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPORT SIMULATOR.DZ — محاكي القرارات الرياضية (FIFA Pro Edition)</title>
<meta name="description" content="SPORT SIMULATOR.DZ — محاكي القرارات الرياضية ببطاقات FUT، التوجيه الصوتي، وقياس رد الفعل بالمللي ثانية.">
<meta name="theme-color" content="#0b7a45">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070e17;--card:#0f172a;--tx:#f1f5f2;--mut:#94a3b8;--gr:#10b981;--go:#f59e0b;--bd:#1e293b;--rd:#ef4444;--fifa-gold:linear-gradient(135deg, #f59e0b 0%, #d97706 100%);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',system-ui,sans-serif;line-height:1.7;min-height:100%}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 20px;border-bottom:3px solid var(--go);background:var(--card);box-shadow:0 4px 15px rgba(0,0,0,0.6)}
.logo{font-weight:900;letter-spacing:.5px;cursor:pointer;direction:ltr;color:#fff;font-size:1.1rem}
.fl{font-size:.8em;vertical-align:middle}
nav button,.lk{background:none;border:0;color:var(--mut);font:inherit;font-size:.9rem;cursor:pointer;padding:4px 8px;font-weight:700}
nav button:hover,.lk:hover{color:var(--go)}
main{max-width:800px;margin:0 auto;padding:16px}
h1{font-size:1.9rem;margin:8px 0 0;direction:ltr;text-align:center}
h2{margin:18px 0 8px;color:#fff}h3{margin:0 0 6px}
.sub{text-align:center;color:var(--gr);font-weight:800;font-size:1.15rem;margin:0}
.slg{text-align:center;color:var(--go);font-weight:800;margin:12px 0 4px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}
@media(max-width:560px){.g2{grid-template-columns:1fr}}

/* FIFA Ultimate Team Card Style */
.fut-card {
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  border: 2px solid var(--go);
  border-radius: 16px;
  padding: 16px;
  margin: 12px 0;
  box-shadow: 0 10px 30px rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  gap: 16px;
}
.fut-rating {
  font-size: 1.8rem;
  font-weight: 900;
  color: var(--go);
  line-height: 1;
}
.fut-pos { font-size: 0.8rem; font-weight: 800; color: var(--mut); }
.fut-info { flex: 1; }

.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
.pick{cursor:pointer;border-top:4px solid var(--gr);margin:0;transition:transform 0.2s}
.pick:hover{transform:translateY(-3px);border-top-color:var(--go)}
.ic{font-size:2.4rem}
.pick p{color:var(--mut);font-size:.9rem;margin:6px 0 10px}
.b,.opt,.ch{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--gr);padding:12px 20px;background:var(--gr);color:#000;font-weight:900;box-shadow:0 4px 15px rgba(16,185,129,0.3)}
.b{color:#000;background:var(--fifa-gold);border:none}
.opt{width:100%;text-align:right;background:var(--card);color:var(--tx);border-color:var(--bd);font-weight:700}
.opt:hover,.ch:hover{border-color:var(--go);background:rgba(245,158,11,0.1)}
.ch{background:var(--card);color:var(--tx);border-color:var(--bd);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.soon{text-align:center;color:var(--mut);border:1px dashed var(--bd);border-radius:12px;padding:12px;margin-top:14px}
svg.pt{width:100%;height:auto;border-radius:12px;display:block;margin:8px 0;box-shadow:inset 0 0 20px rgba(0,0,0,0.5)}
.en{will-change:transform}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--gr)}
.tc{text-align:center;font-size:2rem;font-weight:900;color:var(--go);margin:2px 0 8px}
.mt{color:var(--mut);font-size:.85rem}
.ob{font-size:1.3rem;font-weight:900;text-align:center;padding:12px;border-radius:12px;border:2px solid var(--bd)}
.n3{border-color:var(--gr);background:rgba(16,185,129,0.1)}.n2{border-color:var(--go);background:rgba(245,158,11,0.1)}.n0{border-color:var(--rd);background:rgba(239,68,68,0.1)}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.lg{font-size:.8rem;color:var(--mut);text-align:center}
footer{text-align:center;color:var(--mut);font-size:.85rem;padding:20px 16px 28px;border-top:1px solid var(--bd);margin-top:24px}
footer b{color:var(--tx);direction:ltr;display:inline-block}
button:focus-visible{outline:3px solid var(--go);outline-offset:2px}
label{display:block;margin-top:8px;color:var(--mut);font-size:.9rem}select,input,textarea{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin:4px 0}
</style>
</head>
<body>
<header>
  <span class="logo" onclick="home()"><span class="fl">🇩🇿</span> EA SPORTS · SPORT SIMULATOR</span>
  <nav><button onclick="perf()">📊 أدائي FUT</button><button onclick="about()">About</button><a class="lk" href="index.html">← المتجر</a></nav>
</header>
<main id="app"></main>
<footer><b><span class="fl">🇩🇿</span> SPORT SIMULATOR.DZ</b><br>فكرة وتطوير:<br>المربي الرياضي ومدرب الحراس بن عبد الله الهواري</footer>
<script>
const L={ar:{sub:'محاكي القرارات الرياضية (FIFA Pro)',slogan:'تدرب على القرار السريع بأسلوب FUT والمحترفين.',path:'اختر مسارك',start:'ابدأ التدريب ⚽'}};
const t=k=>L.ar[k]||k;
const $=s=>document.querySelector(s);
const rnd=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const SP=['','بطيئة 🐢','متوسطة ⚡','سريعة 🚀'],PR=['','منخفض 🟢','متوسط 🟡','عالٍ 🔴'];

const G=[
{id:'g1',n:'الانفراد الصريح',sk:'غلق الزاوية والمواجهة الفردية',tip:'قرار الخروج تحسمه المسافة والزمن بدقة.',
 gen:()=>({d:rnd(8,22),s:rnd(1,3),pr:2}),txt:p=>`مهاجم منفرد يبعد ${p.d} م عنك، وسرعته ${SP[p.s]}.`,
 init:p=>{const o=[95-p.d,30];return{me:[95,32],opp:o,ball:[o[0]+2,30]}},od:[6,1],
 O:[['التقدم نحو الكرة وتقليص الزاوية',p=>p.d<=14?3:p.d<=18?2:1,.5,'التقدم من مسافة بعيدة يترك مساحة خلفك.','المسافة مناسبة لتقليص الزاوية قبل التسديد.'],
 ['غلق الزاوية بثبات',p=>p.d>=12&&p.d<=19?3:2,.3,'غلق الزاوية وحده لم يكن كافيًا لهذه المسافة.','التقدم الجزئي مع وضعية جاهزة يقلص الزاوية بدقة.'],
 ['البقاء على خط المرمى',p=>p.d>18?2:p.d>14?1:0,0,'البقاء ثابتًا يمنح المهاجم زاوية المرمى كاملة.','المهاجم بعيد، فالصمود مقبول.'],
 ['المواجهة السريعة بالقفازات',p=>p.d<=10?3:p.d<=13?2:0,.8,'الاندفاع من بعيد يعرضك للمراوغة.','المهاجم قريب جداً، المواجهة تقلص زمنه وزاويته.']]},
{id:'g11',n:'ركلة جزاء حاسمة',sk:'توقيت وقراءة مسدد ركلة الجزاء',tip:'في ركلات الجزاء، انتظر حركة قدم المسدد الأخيرة.',
 gen:()=>({d:11,s:3,pr:3}),txt:p=>`ركلة جزاء حاسمة في الدقيقة 90! المسدد يستعد للتسديد.`,
 init:p=>({me:[97,32],opp:[96,32],ball:[95,32]}),od:[1,0],
 O:[['اختيار الزاوية اليمنى مبكراً',()=>1,.5,'القفز المبكر يترك الزاوية الأخرى مكشوفة تماماً.',''],
 ['الثبات بمنتصف المرمى حتى لحظة التسديد',()=>3,0,'','البقاء بالمنتصف يمنحك فرصة تغطية الزاويتين برد فعل.',[97,32]],
 ['التحرك يميناً ويساراً لتشتيت المسدد',()=>2,.2,'','التمويه قد يربك المسدد أحياناً.','']]},
{id:'g12',n:'ركلة حرة مباشرة',sk:'التمركز مع الحائط البشري',tip:'احمِ القائم البعيد ودع الحائط يغطي القريب.',
 gen:()=>({d:rnd(18,25),s:3,pr:2}),txt:p=>`ركلة حرة مباشرة على خط منطقة الجزاء أمام حائط من 4 لاعبين.`,
 init:p=>({me:[97,32],opp:[80,24],ball:[79,24]}),od:[1,0],
 O:[['التمركز خلف الحائط مباشرة',()=>1,0,'التمركز خلف الحائط يغطي القريب لكنه يحجب رؤيتك.',''],
 ['التمركز بمنتصف المرمى لرؤية الكرة',()=>3,0,'','رؤية انطلاق الكرة تمنحك ثانية إضافية للتصدي.'],
 ['التركيز على القائم البعيد فقط',()=>2,0,'','الحائط يغطي القريب فتحمي البعيد بذكاء.','']]},
{id:'g2',n:'تسديدة أرضية قوية',sk:'الوضعية المنخفضة والكرات الأرضية',tip:'سرعة الكرة تحدد المسك أو الإبعاد.',
 gen:()=>({d:rnd(10,25),s:rnd(1,3),pr:1}),txt:p=>`تسديدة أرضية من ${p.d} م وسرعتها ${SP[p.s]}.`,
 init:p=>({me:[97,32],opp:[98-p.d,20],ball:[100-p.d,20]}),od:[2,0],
 O:[['الوضع المنخفض والامساك بالكرة',p=>p.s<3?3:1,.55,'الكرة سريعة ومسكها قد يرتد للمهاجم.','السرعة تسمح بالمسك الآمن.'],
 ['إبعاد الكرة بعيدًا عن المرمى',p=>p.s==3?3:2,.55,'','الإبعاد أأمن حين تكون الكرة صاروخية.'],
 ['السقوط والغوص السريع',p=>p.d>18||p.s==3?2:1,.75,'السقوط المبكر يقلل تحكمك.','الغوص يغطي مسار الكرة البعيد.'],
 ['الثبات دون حركة',()=>0,0,'عدم الحركة يترك المرمى مكشوفاً.','']]},
{id:'g3',n:'عرضية عالية',sk:'الكرات العالية والقبضة',tip:'الازدحام يحدد: التقاط بالكفين أم إبعاد بالقبضة.',
 gen:()=>({d:rnd(14,28),s:rnd(1,3),pr:rnd(1,3)}),txt:p=>`عرضية عالية، ويتواجد ${p.pr} مهاجمين بمنطقة الجزاء.`,
 init:p=>({me:[97,32],opp:[90,30],ball:[88,6]}),od:[-1,0],
 O:[['الخروج والتقاط الكرة بالكفين',p=>p.pr==1?(p.d<=22?3:2):0,.6,'الازدحام يجعل الالتقاط مخاطرة كبيرة.','قلة المنافسين تسمح بالالتقاط.'],
 ['الخروج وإبعاد بالقبضة الآمنة',p=>p.pr>=2?3:2,.6,'القبضة أقل ملاءمة لوحدك.','مع الازدحام تعد القبضة الخيار الأأمن.'],
 ['البقاء على خط المرمى',p=>p.pr==3?1:0,0,'البقاء يترك الكرة للمهاجمين.',''],
 ['التمركز وانتظار الكرة الثانية',p=>p.pr==3?2:1,.15,'انتظار الكرة الثانية يتخلى عن الأولى.','توازن جيد للكرة المرتدة.']]},
{id:'p1',n:'استلام تحت الضغط العالي',sk:'الاستلام واللعب تحت الضغط',tip:'اقرأ مستوى الضغط قبل أن تستلم الكرة.',
 gen:()=>({d:rnd(1,6),s:2,pr:rnd(1,3)}),txt:p=>`تستلم الكرة وأنت مضغوط (${PR[p.pr]})، والمدافع على بعد ${p.d} م خلفك.`,
 init:p=>({me:[48,32],ball:[48,32],opp:[48-p.d,35],mate:[60,18],gk:[97,32]}),od:[3,-2],
 O:[['تمرير مباشر للزميل',p=>p.pr>=2?3:2,[0,0],'الضغط منخفض وكان الاحتفاظ أفضل.','مع ضغط مرتفع يخلصك التمرير المباشر.','m'],
 ['الاحتفاظ بالكرة بمهارة',p=>p.pr==1?3:p.pr==2?1:0,[0,0],'الاحتفاظ تحت ضغط مرتفع يخسر الكرة.','الضغط منخفض والكرة آمنة معك.','c'],
 ['الدوران السريع بالكرة',p=>p.d>=4?3:p.d>=3?2:0,[6,-4],'المدافع قريب جداً والدوران يكشف الكرة.','المسافة تسمح بالدوران وكسب المساحة.','c'],
 ['إعادة الكرة للخلف للتأمين',p=>p.pr==3?3:2,[-2,0],'إعادة الكرة تبطئ الهجوم دون حاجة.','خيار آمن يحافظ على الاستحواذ.',[38,42]]]}
];

const byId=id=>[...G].find(s=>s.id==id);
const PT=`<svg class="pt" id="pt" viewBox="0 0 100 64"><rect width="100" height="64" fill="#15803d"/><g fill="none" stroke="#fff" stroke-opacity=".7" stroke-width=".4"><rect x="1" y="1" width="98" height="62"/><path d="M50 1V63"/><circle cx="50" cy="32" r="8"/><rect x="1" y="16" width="16" height="32"/><rect x="83" y="16" width="16" height="32"/><rect x="99" y="27" width="1.5" height="10"/><rect x="-.5" y="27" width="1.5" height="10"/></g><g id="tr"></g>${[['o','#ef4444',2.2],['m','#3b82f6',2.2],['x','#94a3b8',2.2],['u','#f59e0b',2.5],['k','#ffffff',1.2]].map(([k,c,r])=>`<g id="e_${k}" class="en"><circle r="${r}" fill="${c}" stroke="#000" stroke-width=".4"/><circle r="${r*0.5}" fill="#000" fill-opacity="0.3"/></g>`).join('')}</svg><div class="lg">🟡 أنت (FUT Player) · 🔴 المنافس · 🔵 الزميل · ⚪ الكرة</div><div class="lg" id="pl"></div>`;

function put(k,pos,d){const e=document.getElementById('e_'+k);if(!e)return;if(!pos){e.style.display='none';return}e.style.display='';e.style.transition=d?`transform ${d}s ease-in-out`:'none';e.style.transform=`translate(${pos[0]}px,${pos[1]}px)`}
function setup(I){put('u',I.me);put('k',I.ball);put('o',I.opp);put('m',I.mate);put('x',I.gk)}

// Voice Narration (TTS)
function speakScenario(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ar-SA';
    utterance.rate = 1.0;
    window.speechSynthesis.speak(utterance);
  }
}

function play(i,dur,trail){const{sc,p}=S.cur,I=sc.init(p);
 const o=i<0?['',()=>0,0,'','',sc.O[0][5]]:sc.O[i],n=o[1](p),B=I.ball,M=I.me,m=o[2];
 const me2=typeof m=='number'?[M[0]+(B[0]-M[0])*m,M[1]+(B[1]-M[1])*m]:[M[0]+m[0],M[1]+m[1]];
 const op2=[I.opp[0]+sc.od[0],I.opp[1]+sc.od[1]],md=o[5]||'k';let b2;
 if(md=='k')b2=[[101,34],[me2[0]-6,me2[1]+10],[70,8],me2][n];
 else if(md=='g')b2=n>=2?[101,32]:n==1?[101,12]:op2;
 else if(md=='m')b2=n>=2?I.mate:op2;
 else if(md=='c')b2=n>=1?me2:op2;
 else if(md=='w')b2=n>=2?me2:[op2[0]-2,op2[1]];
 else if(md=='l')b2=[op2[0]-2,op2[1]];
 else b2=n>=2?md:op2;
 setup(I);$('#tr').innerHTML='';$('#pl').textContent='عرض التحرّك: '+(i<0?'لا قرار':sc.O[i][0]);
 setTimeout(()=>{put('u',me2,dur);put('k',b2,dur);put('o',op2,dur);
  if(trail)$('#tr').innerHTML=`<circle cx="${M[0]}" cy="${M[1]}" r="3.6" fill="none" stroke="#f59e0b" stroke-width=".5"/><line x1="${M[0]}" y1="${M[1]}" x2="${me2[0]}" y2="${me2[1]}" stroke="#f59e0b" stroke-width=".5" stroke-dasharray="1.5 1"/><line x1="${B[0]}" y1="${B[1]}" x2="${b2[0]}" y2="${b2[1]}" stroke="#fff" stroke-width=".4" stroke-dasharray="1 1"/>`},60)}

const S={role:'g',age:'U15',lvl:'متوسط',mode:'test',q:[],i:0,res:[]};
const LV={'مبتدئ':5,'متوسط':4,'متقدم':3,'احترافي':2};
const AGES=['U9','U11','U13','U15','U17','U19','Seniors'].map(a=>[a,a]);
const LVS=[['🟢 مبتدئ','مبتدئ'],['🟡 متوسط','متوسط'],['🟠 متقدم','متقدم'],['🔴 احترافي','احترافي']];
const ld=()=>{try{return JSON.parse(localStorage.getItem('ssdz_fifa_pro')||'[]')}catch(e){return[]}};
const sv=a=>{try{localStorage.setItem('ssdz_fifa_pro',JSON.stringify(a))}catch(e){}};
const R=h=>{clearInterval(S.tm);$('#app').innerHTML=h;scrollTo(0,0)};
const avg=a=>a.reduce((x,y)=>x+y,0)/(a.length||1);
const bar=(l,v)=>`<div class="card"><div class="row" style="border:0"><span>${l}</span><b>${Math.round(v)}%</b></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,v))}%"></i></div></div>`;

function home(){R(`<h1><span class="fl">🇩🇿</span> EA SPORTS · SPORT SIMULATOR</h1><p class="sub">${t('sub')}</p><p class="slg">${t('slogan')}</p><h2>${t('path')}</h2>
<div class="grid g2">
<div class="card pick" onclick="start()"><div class="ic">🧤</div><h3>حارس المرمى والمحاكي الاحترافي</h3><b>FUT GOALKEEPER MODE</b><p>محاكاة الانفرادات، ركلات الجزاء، الركلات الحرة، والعرضيات بسرعة رد فعل بالمللي ثانية.</p><button class="b">${t('start')}</button></div></div>
<div class="chips" style="justify-content:center"><button class="ch" onclick="perf()">📊 FUT PERFORMANCE CARD</button></div>`)}

function start(ids){const pool=G;S.q=ids||[...pool].sort(()=>Math.random()-.5);S.i=0;S.res=[];next()}

function next(){if(S.i>=S.q.length)return report();
 const sc=S.q[S.i],p=sc.gen();
 const lim=4;S.cur={sc,p,lim,t0:performance.now()};

 const scenarioText = `${sc.n}. ${sc.txt(p)}`;
 speakScenario(scenarioText);

 R(`<div class="mt">موقف ${S.i+1}/${S.q.length} · ${S.age} · ${S.lvl}</div>
 <div class="fut-card">
   <div class="fut-rating">92<br><span class="fut-pos">GK</span></div>
   <div class="fut-info">
     <h3>${sc.n}</h3>
     <p style="margin:0; font-size:0.9rem; color:var(--mut);">${sc.txt(p)}</p>
   </div>
 </div>
 ${PT}
 <div class="bar"><i id="tb" style="width:100%"></i></div><div class="tc" id="tc">${lim} ث</div>
 <div class="grid">${sc.O.map((o,i)=>`<button class="opt" onclick="ans(${i})">${o[0]}</button>`).join('')}</div>`);
 setup(sc.init(p));

 S.tm=setInterval(()=>{
   const elapsed = (performance.now()-S.cur.t0)/1000;
   const r = Math.max(0, lim - elapsed);
   $('#tc').textContent = r.toFixed(1) + ' ث';
   $('#tb').style.width = (r/lim*100)+'%';
   if(r<=0) ans(-1);
 }, 100);
}

function ans(i){
 clearInterval(S.tm);
 const {sc, p, lim, t0} = S.cur;
 const reactionTimeMs = Math.round(performance.now() - t0); // Milliseconds precision!

 const qs = sc.O.map(o => o[1](p));
 const best = qs.indexOf(Math.max(...qs));
 const n = i < 0 ? 0 : qs[i];

 const r = {
   id: sc.id,
   n,
   reactionMs: reactionTimeMs,
   opt: i == best,
   role: 'g'
 };

 S.res.push(r);
 const a = ld(); a.push(r); sv(a);
 S.last = { i, best, qs, n, reactionMs: reactionTimeMs };
 res();
}

function res(){
 const {sc, p, lim} = S.cur;
 const {i, best, qs, n, reactionMs} = S.last;
 const o = i < 0 ? null : sc.O[i];
 const b = sc.O[best];

 const speedRating = reactionMs < 1200 ? '⚡ برق (سريع جداً)' : reactionMs < 2500 ? '👍 ممتاز' : '⚠️ بطيء';
 const OUT = ['هدف مرماك 🥅', 'ارتداد خطير 🟠', 'إبعاد ناجح ⚪', 'تصدي أسطوري 🧤'];

 R(`<div class="mt">موقف ${S.i+1}/${S.q.length}</div>
 <h2>${sc.n}</h2>
 ${PT}
 <div class="ob n${n}">${OUT[n]}</div>
 <div class="card" style="text-align:center; font-weight:800; color:var(--go);">
   ⏱️ سرعة رد الفعل واتخاذ القرار: ${reactionMs} مللي ثانية (${speedRating})
 </div>
 <div class="chips">
   <button class="ch" onclick="play(${i},1.4,0)">▶️ تشغيل الحركة</button>
   <button class="ch" onclick="play(${i},4,0)">🐢 Slow Motion</button>
 </div>
 <div class="card">
   <h3>تحليل EA SPORTS</h3>
   <p><b>قرارك:</b> ${o ? o[0] : 'لا قرار'}</p>
   <p><b>لماذا؟</b> ${n >= 2 ? (o[4] || 'قرار سليم.') : (o[3] || 'السياق لا يدعمه.')}</p>
   <p><b>القرار البديل:</b> ${best != i ? b[0] : 'قرارك هو الأنسب والأفضل ✅'}</p>
 </div>
 <button class="b" onclick="S.i++;next()">${S.i+1>=S.q.length?'عرض بطاقة الأداء FUT':'الموقف التالي'}</button>`);
 setup(sc.init(p)); play(i,1.4,0);
}

function report(){
 const r = S.res, N = r.length;
 const score = Math.round(avg(r.map(x => x.n)) / 3 * 99);
 const avgReaction = Math.round(avg(r.map(x => x.reactionMs)));

 R(`
 <h2>بطاقة الأداء FUT Match Report 🎮</h2>
 <div class="fut-card" style="text-align:center; justify-content:center; background:linear-gradient(135deg, #f59e0b 0%, #0f172a 100%); color:#000;">
   <div>
     <div style="font-size:3.5rem; font-weight:900; color:#fff; line-height:1;">${score}</div>
     <div style="font-weight:800; color:#000;">FUT RATING SCORE ⭐</div>
     <div style="font-size:0.85rem; margin-top:6px; color:#fff;">متوسط زمن رد الفعل: ${avgReaction} ms</div>
   </div>
 </div>
 ${bar('🧠 دقة اتخاذ القرار', avg(r.map(x => x.n)) / 3 * 100)}
 ${bar('🎯 التطابق مع القرار الأنسب', r.filter(x => x.opt).length / N * 100)}

 <div class="chips" style="margin-top:20px;">
   <button class="b" onclick="start()">🔄 جلسة جديدة (Play Again)</button>
   <button class="ch" onclick="window.print()">🖨️ طباعة وتصدير PDF</button>
   <button class="ch" onclick="home()">الرئيسية</button>
 </div>`);
}

function perf(){
 const a = ld();
 if(!a.length) return R(`<h2>FUT PERFORMANCE</h2><div class="card">لا توجد محاولات مسجلة بعد.</div><button class="b" onclick="home()">الرئيسية</button>`);
 R(`<h2>FUT PERFORMANCE STATS</h2><div class="card"><div class="row"><span>إجمالي المحاولات</span><b>${a.length}</b></div><div class="row"><span>متوسط سرعة رد الفعل</span><b>${Math.round(avg(a.map(x=>x.reactionMs)))} ms</b></div></div><button class="b" onclick="home()">الرئيسية</button>`);
}

function about(){
 R(`<h2><span class="fl">🇩🇿</span> SPORT SIMULATOR.DZ</h2><div class="card"><p>محاكي القرار الرياضي بأسلوب FIFA Pro مع التوجيه الصوتي وقياس رد الفعل بالمللي ثانية.</p><p><b>المربي الرياضي ومدرب الحراس بن عبد الله الهواري</b></p></div><button class="b" onclick="home()">الرئيسية</button>`);
}

home();
</script>
</body>
</html>
