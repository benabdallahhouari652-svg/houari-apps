<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بنك التمارين والحصص التدريبية الاحترافية | Pro Training Bank 📋⚽</title>
<meta name="description" content="منصة بيداغوجية عالمية لبرامج التدريب، الحصص الأسبوعية، رسومات الملاعب التكتيكية، وفيديوهات الشرح الفني للمدربين.">
<meta name="theme-color" content="#0f5b3a">

<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #070e17;
  --card: #0f172a;
  --tx: #f1f5f2;
  --mut: #94a3b8;
  --gr: #10b981;
  --go: #f59e0b;
  --bd: #1e293b;
  --rd: #ef4444;
  --shadow: 0 10px 30px rgba(0,0,0,0.6);
  box-sizing: border-box;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font-family: 'Cairo', system-ui, sans-serif;
  line-height: 1.8;
  -webkit-tap-highlight-color: transparent;
}

a { color: inherit; text-decoration: none; }

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #0f5b3a;
  color: #fff;
  border-bottom: 3px solid var(--go);
  padding: 10px 16px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.6);
}
.header-bar {
  max-width: 1000px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand {
  font-weight: 900;
  font-size: 1.1rem;
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn-hdr {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.3);
  padding: 5px 12px;
  border-radius: 8px;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
}

main {
  max-width: 1050px;
  margin: 0 auto;
  padding: 20px 16px;
}

.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}

h2 {
  font-size: 1.3rem;
  font-weight: 900;
  margin-top: 0;
  color: var(--go);
  display: flex;
  align-items: center;
  gap: 8px;
}

.filter-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
label { font-weight: 700; font-size: 0.88rem; display: block; margin-bottom: 4px; color: var(--mut); }
select {
  width: 100%;
  font-family: inherit;
  font-size: 0.95rem;
  padding: 10px 14px;
  border: 1px solid var(--bd);
  border-radius: 10px;
  background: var(--bg);
  color: var(--tx);
}

.drills-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
  margin-top: 16px;
}
.drill-card {
  background: rgba(30, 41, 59, 0.5);
  border: 1px solid var(--bd);
  border-radius: 14px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: transform 0.2s, border-color 0.2s;
  cursor: pointer;
}
.drill-card:hover {
  transform: translateY(-3px);
  border-color: var(--go);
}
.drill-badge {
  font-size: 0.74rem;
  font-weight: 800;
  background: rgba(16, 185, 129, 0.2);
  color: var(--gr);
  padding: 2px 10px;
  border-radius: 99px;
  align-self: flex-start;
}
.drill-title { font-weight: 900; font-size: 1.1rem; color: #fff; }
.drill-desc { font-size: 0.88rem; color: var(--mut); line-height: 1.6; }

.btn-act {
  background: var(--go);
  color: #000;
  border: none;
  padding: 10px 18px;
  border-radius: 10px;
  font-family: inherit;
  font-weight: 900;
  font-size: 0.92rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn-act:hover { background: #d97706; }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(6px);
  z-index: 200;
  display: none;
  place-items: center;
  padding: 20px;
}
.modal-overlay.open { display: grid; }
.modal-box {
  background: var(--card);
  border: 2px solid var(--go);
  border-radius: 20px;
  max-width: 750px;
  width: 100%;
  padding: 24px;
  max-height: 90vh;
  overflow-y: auto;
}

.pitch-canvas-box {
  width: 100%;
  height: 240px;
  background: #15803d;
  border: 2px solid #fff;
  border-radius: 12px;
  position: relative;
  overflow: hidden;
  margin: 12px 0;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-weight: 700;
  font-size: 0.9rem;
  z-index: 1000;
  opacity: 0;
  transition: all 0.3s;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
</style>
</head>
<body>

<header>
  <div class="header-bar">
    <div class="brand">
      📋 بنك التمارين والحصص التدريبية الاحترافية
    </div>
    <a class="btn-hdr" href="index.html">← متجر التطبيقات</a>
  </div>
</header>

<main>
  <div class="card">
    <h2>🔍 محرك البحث الاحترافي عن الحصص والتمارين</h2>
    <div class="filter-grid">
      <div>
        <label for="filterAge">اختر الفئة السنية:</label>
        <select id="filterAge">
          <option value="all">جميع الفئات</option>
          <option value="seniors">أكابر (Seniors)</option>
          <option value="u19">أقل من 19 سنة (U19)</option>
          <option value="u17">أقل من 17 سنة (U17)</option>
          <option value="u15">أقل من 15 سنة (U15)</option>
          <option value="u13">أقل من 13 سنة (مدرسة كرة القدم)</option>
        </select>
      </div>
      <div>
        <label for="filterTopic">اختر موضوع الحصة:</label>
        <select id="filterTopic">
          <option value="all">جميع المواضيع</option>
          <option value="physical">🏋️ التحضير البدني والسرعة</option>
          <option value="tactical">🧠 التكتيك والتمركز الجماعي</option>
          <option value="technical">⚽ التقنية والمهارة الفردية</option>
          <option value="gk">🧤 حراس المرمى</option>
          <option value="setpieces">📐 الكرات الثابتة</option>
        </select>
      </div>
    </div>
    <button class="btn-act" id="btnSearchDrills">🔍 استعراض الحصص التدريبية</button>
  </div>

  <div class="card">
    <h2>📚 الحصص والتمارين المتاحة (<span id="drillCount">0</span>)</h2>
    <div class="drills-container" id="drillsGrid"></div>
  </div>
</main>

<div class="modal-overlay" id="drillModal">
  <div class="modal-box">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--bd); padding-bottom:10px; margin-bottom:16px;">
      <h2 id="modalTitle" style="margin:0; font-size:1.2rem;">تفاصيل الحصة التدريبية</h2>
      <button class="btn-hdr" id="btnCloseModal">✕ إغلاق</button>
    </div>

    <div class="pitch-canvas-box" id="pitchBox">
      <svg width="100%" height="100%" viewBox="0 0 600 300">
        <rect width="600" height="300" fill="#15803d"/>
        <rect x="20" y="20" width="560" height="260" fill="none" stroke="#fff" stroke-width="2" stroke-opacity="0.7"/>
        <line x1="300" y1="20" x2="300" y2="280" stroke="#fff" stroke-width="2" stroke-opacity="0.7"/>
        <circle cx="300" cy="150" r="50" fill="none" stroke="#fff" stroke-width="2" stroke-opacity="0.7"/>
        <circle cx="150" cy="150" r="12" fill="#3b82f6" stroke="#000" stroke-width="2"/>
        <circle cx="220" cy="100" r="12" fill="#3b82f6" stroke="#000" stroke-width="2"/>
        <circle cx="450" cy="150" r="12" fill="#ef4444" stroke="#000" stroke-width="2"/>
        <circle cx="210" cy="105" r="5" fill="#fff"/>
        <path d="M 162 150 Q 190 100 215 102" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="5,5"/>
      </svg>
    </div>

    <div id="modalBody" style="font-size:0.95rem; line-height:1.8;"></div>

    <div style="margin-top:20px; display:flex; justify-content:flex-end; gap:10px;">
      <button class="btn-act" onclick="window.print()">🖨️ طباعة الحصة التدريبية PDF</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const allDrills = [
  {
    id: 1, age: "u15", topic: "physical", title: "تنمية التحمل الهوائي والانتقالي بالكرة",
    desc: "مساحة 30×20 م، تمريرات متتالية سريعة لمدة 4 دقائق بثلاث مجموعات لتطوير قدرات التحمل.",
    ageName: "أقل من 15 سنة", topicName: "التحضير البدني",
    duration: "60 دقيقة",
    objective: "تطوير التحمل الخاص والربط بين السرعة والتحمل بالكرة.",
    steps: "1. الإحماء الحركي بدون كرة (10 دقيقة).\n2. التمرين الرئيسي: حيازة الكرة 4 ضد 4 في مساحة ضيقة مع 2 جوكر (30 دقيقة).\n3. الختام: إطالة وتهدئة (10 دقيقة)."
  },
  {
    id: 2, age: "seniors", topic: "tactical", title: "الضغط العالي واستعادة الكرة في الثلث الهجومي",
    desc: "تمرين 4 ضد 4 + 2 جوكر لتطبيق استراتيجية الضغط العالي وقطع التمريرات.",
    ageName: "أكابر", topicName: "التكتيك والتمركز",
    duration: "90 دقيقة",
    objective: "الضغط على حامل الكرة وغلق خطوط التمرير.",
    steps: "1. تنشيط تكتيكي (15 دقيقة).\n2. مواجهة تكتيكية كاملة مع توجيهات المدرب (45 دقيقة).\n3. مباراة مصغرة بدون لمسات كثيرة (20 دقيقة)."
  },
  {
    id: 3, age: "u17", topic: "technical", title: "استلام تحت الضغط والدوران السريع",
    desc: "مواجهة 1 ضد 1 في مساحة ضيقة لتطوير مهارة حماية الكرة والدوران.",
    ageName: "أقل من 17 سنة", topicName: "التقنية والمهارة",
    duration: "75 دقيقة",
    objective: "إتقان حماية الكرة واستلامها بتوجيه القدم العكسية.",
    steps: "1. تباادل التمريرات الثنائية (15 دقيقة).\n2. 1 ضد 1 في المربعات (35 دقيقة).\n3. تسديد على المرمى (15 دقيقة)."
  },
  {
    id: 4, age: "u13", topic: "gk", title: "سرعة رد الفعل والارتماء الأرضي للبراعم",
    desc: "تسديدات أرضية متتالية خفيفة من مسافة قريبة لتأكيد وضعية الجسد السليمة.",
    ageName: "أقل من 13 سنة", topicName: "حراس المرمى",
    duration: "60 دقيقة",
    objective: "تصحيح وضعية الارتماء الأرضي وحماية الزوايا.",
    steps: "1. إحماء بالمرونة والتوافق (15 دقيقة).\n2. تصديات متتالية أرضية (30 دقيقة).\n3. ألعاب ترفيهية حراسة المرمى (15 دقيقة)."
  },
  {
    id: 5, age: "seniors", topic: "gk", title: "استئناف اللعب والاستمرار باللعب والكرات الهوائية (من كتاب Futsal)",
    desc: "تمريرات هوائية واستئناف سريع من حارس المرمى نحو منطقة الهجوم المباشر مع اعتراض التمريرات.",
    ageName: "أكابر وU19", topicName: "حراس المرمى - الصالات",
    duration: "45 دقيقة",
    objective: "إتقان التمرير الهوائي باليد وتوجيه الهجمات المرتدة المباشرة.",
    steps: "1. تقسيم الملعب إلى 3 مناطق وتواجد حارس في كل مرمى وحارس بمنتصف الملعب.\n2. يمرر الحارس كرة هوائية للمحور الهجومي لإنهائها بلمسة واحدة.\n3. يحاول حارس منتصف الملعب قطع الكرة الهوائية وتغيير التموقع."
  },
  {
    id: 6, age: "u19", topic: "gk", title: "الإنهاء من مسافة قريبة واستئناف اللعب بسرعة (Futsal)",
    desc: "مواجهة 2 ضد 2 في نصف الملعب مع التمرير السريع واستئناف اللعب بدحرجة الكرة والتسديد.",
    ageName: "U19 وU17", topicName: "حراس المرمى والتكتيك",
    duration: "50 دقيقة",
    objective: "التصدي للإنهاء السريع وتمرير الكرة خلف خط المنتصف أو دحرجتها للتسديد.",
    steps: "1. بداية بكرة بحوزة أحد الحراس والتمرير لزميل بالنصف.\n2. حد أقصى 6 تمريرات أو 4 ثوان للإنهاء بتسديدة.\n3. بعد كل هجمة، يستأنف الحارس بالتمرير خلف خط المنتصف أو الدحرجة والتسديد."
  },
  {
    id: 7, age: "seniors", topic: "gk", title: "التصدي للتسديدات الأمامية والدفاع عن المرمى",
    desc: "تمرين بـ 3 حراس وستة مهاجمين خلف خط 9 أمتار للتصدي للتسديدات المباشرة وتبادل التموقع.",
    ageName: "أكابر وU19", topicName: "حراس المرمى",
    duration: "40 دقيقة",
    objective: "سرعة غلق الزوايا الأمامية والتصدي للتسديد المباشر وتناوب الحراس.",
    steps: "1. حارس في المرمى وحارسان بمهام التمرير الجانبي.\n2. تسديدات متتالية من خلف خط 9 أمتار بلمسة واحدة.\n3. تبادل أدوار الحراس فور خروج الكرة أو التصدي لها."
  },
  {
    id: 8, age: "u17", topic: "gk", title: "الدفاع عن حافة منطقة الجزاء وخلق حالات 1 ضد 1",
    desc: "رميات تماس نحو حافة منطقة الجزاء للمهاجم للتسديد خلال 3 ثوان وخروج الحارس للتغطية.",
    ageName: "U17 وU15", topicName: "حراس المرمى والتكتيك",
    duration: "45 دقيقة",
    objective: "تقليص زاوية التسديد والمواجهة المباشرة في حالات الانفراد.",
    steps: "1. إرسال رمية تماس نحو حافة المنطقة.\n2. المهاجم لديه 3 ثوان للإنهاء بتسديدة على المرمى.\n3. الحارس يندفع لتقليص الزاوية والتصدي للكرة الأولى أو المرتدة."
  }
];

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

function renderDrills() {
  const age = document.getElementById("filterAge").value;
  const topic = document.getElementById("filterTopic").value;

  const filtered = allDrills.filter(d =>
    (age === "all" || d.age === age) &&
    (topic === "all" || d.topic === topic)
  );

  document.getElementById("drillCount").textContent = filtered.length;
  const grid = document.getElementById("drillsGrid");

  if (!filtered.length) {
    grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--mut); padding:20px;">لا توجد حصص مطابقة للفلاتر المحددة.</div>`;
    return;
  }

  grid.innerHTML = filtered.map(d => `
    <div class="drill-card" onclick="openDrillModal(${d.id})">
      <span class="drill-badge">${d.ageName} · ${d.topicName}</span>
      <div class="drill-title">${d.title}</div>
      <div class="drill-desc">${d.desc}</div>
      <div style="margin-top:auto; font-size:0.8rem; color:var(--go); font-weight:800;">📺 عرض الرسوم والمخطط التكتيكي ←</div>
    </div>
  `).join("");
}

function openDrillModal(id) {
  const d = allDrills.find(x => x.id === id);
  if (!d) return;

  document.getElementById("modalTitle").textContent = d.title;
  document.getElementById("modalBody").innerHTML = `
    <p><b>الفئة المستهدفة:</b> ${d.ageName}</p>
    <p><b>الموضوع:</b> ${d.topicName} (${d.duration})</p>
    <p><b>الهدف البيداغوجي:</b> ${d.objective}</p>
    <p><b>مراحل تنفيذ الحصة:</b><br><pre style="font-family:inherit; white-space:pre-wrap; margin:0;">${d.steps}</pre></p>
  `;

  document.getElementById("drillModal").classList.add("open");
}

document.getElementById("btnCloseModal").onclick = () => {
  document.getElementById("drillModal").classList.remove("open");
};

document.getElementById("btnSearchDrills").onclick = () => {
  renderDrills();
  showToast("تم تحديث قائمة الحصص التدريبية 🔍");
};

renderDrills();
</script>
</body>
</html>
