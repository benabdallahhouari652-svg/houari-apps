<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تطبيق تعليم الإنجليزية للأطفال 🔤 | Kids English Academy</title>
<meta name="description" content="منصة تفاعلية وممتعة لتعليم اللغة الإنجليزية للأطفال بالحروف والأصوات والألوان والحيوانات.">
<meta name="theme-color" content="#0f5b3a">

<!-- PWA Manifest & Fonts -->
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #fdf4ff;
  --card: #ffffff;
  --ink: #3b0764;
  --mut: #7e22ce;
  --accent: #a855f7;
  --ln: #f0abfc;
  box-sizing: border-box;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Cairo', system-ui, sans-serif;
  text-align: center;
}

header {
  background: #a855f7;
  color: #fff;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

main {
  max-width: 850px;
  margin: 0 auto;
  padding: 20px 16px;
}

.grid-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 12px;
  margin-top: 16px;
}

.kid-card {
  background: var(--card);
  border: 3px solid var(--ln);
  border-radius: 16px;
  padding: 16px;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  transition: transform 0.2s;
}
.kid-card:hover { transform: scale(1.05); }

.card-symbol { font-size: 2.5rem; font-weight: 900; color: #a855f7; display: block; }
.card-word { font-size: 1.1rem; font-weight: 800; margin-top: 6px; display: block; color: var(--ink); }

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-weight: 700;
  font-size: 0.9rem;
  z-index: 1000;
  opacity: 0;
  transition: all 0.3s;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
</style>
</head>
<body>

<header>
  <div style="font-weight:800; font-size:1.1rem;">🔤 تطبيق تعليم الإنجليزية للأطفال | Kids English</div>
  <a href="index.html" style="color:#fff; font-weight:700; text-decoration:none;">← المتجر</a>
</header>

<main>
  <h2 style="color:#7e22ce;">اضغط على الحرف أو الكلمة لسماع النطق الإنجليزي الواضح 🔊</h2>

  <div class="grid-cards" id="cardsGrid"></div>
</main>

<div class="toast" id="toast"></div>

<script>
const items = [
  { symbol: "A", word: "Apple 🍎" },
  { symbol: "B", word: "Ball ⚽" },
  { symbol: "C", word: "Cat 🐱" },
  { symbol: "D", word: "Dog 🐶" },
  { symbol: "E", word: "Elephant 🐘" },
  { symbol: "F", word: "Fish 🐟" },
  { symbol: "1", word: "One 1️⃣" },
  { symbol: "2", word: "Two 2️⃣" },
  { symbol: "3", word: "Three 3️⃣" },
  { symbol: "🔴", word: "Red Color" },
  { symbol: "🟢", word: "Green Color" },
  { symbol: "🔵", word: "Blue Color" }
];

const grid = document.getElementById("cardsGrid");
grid.innerHTML = items.map(item => `
  <div class="kid-card" onclick="speakWord('${item.word.split(' ')[0]}')">
    <span class="card-symbol">${item.symbol}</span>
    <span class="card-word">${item.word}</span>
  </div>
`).join("");

function speakWord(word) {
  if ('speechSynthesis' in window) {
    const utterance = new SpeechSynthesisUtterance(word);
    utterance.lang = 'en-US';
    utterance.rate = 0.8;
    window.speechSynthesis.speak(utterance);
    showToast(`Pronunciation: ${word} 🔊`);
  }
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}
</script>
</body>
</html>
