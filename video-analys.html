<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>video ANALYS DZ | أداة تحليل الفيديو الاحترافية 🎬</title>
<meta name="description" content="تطبيق وأداة احترافية لتحليل مباريات وتمارين الفيديو، التكشيف الذكي (LiveTag)، الرسم التكتيكي، وقياس الزوايا والمسافات للمدربين ومحللي الأداء.">
<meta name="theme-color" content="#0f5b3a">

<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0b1310;
  --panel: #14221c;
  --panel-light: #1d3128;
  --accent: #3fbf85;
  --accent-light: #52d197;
  --red: #ef4444;
  --yellow: #f59e0b;
  --blue: #3b82f6;
  --purple: #8b5cf6;
  --text: #f1f5f9;
  --text-mut: #94a3b8;
  --border: #243d31;
  --shadow: 0 4px 20px rgba(0,0,0,0.5);
  box-sizing: border-box;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Cairo', system-ui, sans-serif;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

a { color: inherit; text-decoration: none; }

header {
  height: 56px;
  background: var(--panel);
  border-bottom: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  position: relative;
  z-index: 50;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  font-size: 1.05rem;
  color: #fff;
}
.brand-logo {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: var(--accent);
  color: #000;
  display: grid;
  place-items: center;
  font-size: 1.2rem;
}
.hdr-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.btn {
  background: var(--panel-light);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 6px 12px;
  border-radius: 8px;
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}
.btn:hover {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
}
.btn-primary {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
}
.btn-primary:hover {
  background: var(--accent-light);
}

.studio {
  display: grid;
  grid-template-columns: 310px 1fr 340px;
  height: calc(100vh - 56px);
  overflow: hidden;
}

@media (max-width: 1100px) {
  .studio {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto;
    height: auto;
    overflow: visible;
  }
}

.tools-panel {
  background: var(--panel);
  border-inline-end: 2px solid var(--border);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
}
.panel-title {
  font-size: 0.92rem;
  font-weight: 800;
  color: var(--accent);
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.tool-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}
.tool-btn {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px;
  border-radius: 8px;
  font-family: inherit;
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  transition: all 0.2s;
}
.tool-btn:hover, .tool-btn.active {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
}
.tool-btn span { font-size: 1.1rem; }

.control-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.control-label {
  font-size: 0.78rem;
  color: var(--text-mut);
  font-weight: 700;
}
.color-picker {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.color-dot {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform 0.2s;
}
.color-dot:hover, .color-dot.active {
  transform: scale(1.2);
  border-color: #fff;
}

.video-workspace {
  display: flex;
  flex-direction: column;
  background: #000;
  position: relative;
  overflow: hidden;
}
.video-container {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #050a08;
  overflow: hidden;
}
.dual-container {
  display: flex;
  width: 100%;
  height: 100%;
  gap: 4px;
  background: #000;
}
.dual-box {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #050a08;
}

video {
  max-width: 100%;
  max-height: 100%;
  display: block;
}
canvas#overlayCanvas {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: auto;
  cursor: crosshair;
}

.player-controls {
  background: var(--panel);
  border-top: 2px solid var(--border);
  padding: 10px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.timeline-slider-wrapper {
  display: flex;
  align-items: center;
  gap: 10px;
}
.timeline-slider {
  flex: 1;
  accent-color: var(--accent);
  cursor: pointer;
}
.time-display {
  font-family: monospace;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--accent);
}

.controls-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.ctrl-group {
  display: flex;
  align-items: center;
  gap: 6px;
}
.ctrl-btn {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  width: 34px;
  height: 34px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.2s;
}
.ctrl-btn:hover {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
}

.tagging-panel {
  background: var(--panel);
  border-inline-start: 2px solid var(--border);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
}
.tag-matrix {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}
.tag-chip-btn {
  padding: 8px 6px;
  border-radius: 8px;
  border: none;
  color: #fff;
  font-family: inherit;
  font-weight: 800;
  font-size: 0.8rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  transition: transform 0.15s, opacity 0.15s;
}
.tag-chip-btn:active { transform: scale(0.95); }
.tag-chip-btn:hover { opacity: 0.9; }

.lead-times {
  display: flex;
  gap: 8px;
  background: var(--bg);
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
}
.lead-input {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.78rem;
}
.lead-input input {
  width: 42px;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 2px 4px;
  border-radius: 4px;
  text-align: center;
  font-weight: bold;
}

.stats-summary {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.stat-row {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.stat-header {
  display: flex;
  justify-content: space-between;
  font-size: 0.74rem;
  font-weight: 700;
}
.stat-bar-bg {
  height: 6px;
  background: var(--panel);
  border-radius: 99px;
  overflow: hidden;
}
.stat-bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.3s;
}

.events-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 250px;
  overflow-y: auto;
}
.event-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  cursor: pointer;
  transition: border-color 0.2s;
}
.event-card:hover { border-color: var(--accent); }
.event-info {
  display: flex;
  flex-direction: column;
}
.event-tag-title {
  font-weight: 800;
  font-size: 0.82rem;
  display: flex;
  align-items: center;
  gap: 6px;
}
.event-time {
  font-size: 0.72rem;
  color: var(--text-mut);
  font-family: monospace;
}
.event-del {
  background: none;
  border: none;
  color: var(--red);
  cursor: pointer;
  font-weight: bold;
  font-size: 1rem;
}

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-weight: 700;
  font-size: 0.9rem;
  box-shadow: var(--shadow);
  z-index: 1000;
  opacity: 0;
  transition: all 0.3s;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(5px);
  z-index: 200;
  display: none;
  place-items: center;
  padding: 20px;
}
.modal-overlay.open { display: grid; }
.modal-box {
  background: var(--panel);
  border: 2px solid var(--border);
  border-radius: 16px;
  max-width: 680px;
  width: 100%;
  padding: 22px;
  max-height: 85vh;
  overflow-y: auto;
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo">🎬</div>
    <div>
      video ANALYS DZ
      <small style="display:block; font-size:0.68rem; color:var(--accent); font-weight:600;">LiveTag Pro Edition 🇩🇿</small>
    </div>
  </div>

  <div class="hdr-actions">
    <label class="btn btn-primary" for="videoFileInput">
      📂 فتح فيديو
      <input type="file" id="videoFileInput" accept="video/*" style="display:none;">
    </label>
    <button class="btn" id="btnLiveCamera">📷 كاميرا مباشرة</button>
    <button class="btn" id="btnDualMode">🎦 مقارنة شاشتين</button>
    <button class="btn" id="btnSnapshot">📸 لقطة HD</button>
    <button class="btn" id="btnExportProject">💾 حفظ المشروع</button>
    <label class="btn" for="importProjectInput">
      📂 استرجاع
      <input type="file" id="importProjectInput" accept=".json" style="display:none;">
    </label>
    <button class="btn" id="btnExportReport">📑 تقرير PDF</button>
    <a class="btn" href="index.html">← المتجر</a>
  </div>
</header>

<div class="studio">
  <aside class="tools-panel">
    <div class="panel-title">
      <span>🎨 أدوات الرسم</span>
      <button class="btn" id="btnClearCanvas" style="padding:2px 8px; font-size:0.75rem;">مسح</button>
    </div>

    <div class="tool-grid">
      <button class="tool-btn active" data-tool="select"><span>👆</span>تأشير</button>
      <button class="tool-btn" data-tool="pen"><span>✏️</span>قلم حر</button>
      <button class="tool-btn" data-tool="arrow"><span>➡️</span>سهم</button>
      <button class="tool-btn" data-tool="curvedArrow"><span>🔄</span>منحني</button>
      <button class="tool-btn" data-tool="spotlight"><span>💡</span>بقعة ضوء</button>
      <button class="tool-btn" data-tool="circle"><span>⭕</span>دائرة</button>
      <button class="tool-btn" data-tool="rect"><span>⏹️</span>مستطيل</button>
      <button class="tool-btn" data-tool="angle"><span>📐</span>زاوية</button>
      <button class="tool-btn" data-tool="text"><span>🔤</span>نص</button>
      <button class="tool-btn" id="btnToggleGrid"><span>⚽</span>شبكة الملعب</button>
    </div>

    <div class="control-group">
      <div class="control-label">لون الرسم</div>
      <div class="color-picker">
        <div class="color-dot active" style="background:#ef4444;" data-color="#ef4444"></div>
        <div class="color-dot" style="background:#f59e0b;" data-color="#f59e0b"></div>
        <div class="color-dot" style="background:#10b981;" data-color="#10b981"></div>
        <div class="color-dot" style="background:#3b82f6;" data-color="#3b82f6"></div>
        <div class="color-dot" style="background:#ffffff;" data-color="#ffffff"></div>
      </div>
    </div>

    <div class="control-group">
      <div class="control-label">سُمك الخط: <span id="lineWidthVal">4px</span></div>
      <input type="range" id="lineWidthRange" aria-label="سُمك الخط" min="2" max="16" value="4" style="accent-color:var(--accent);">
    </div>

    <div class="control-group" style="margin-top:auto;">
      <button class="btn" id="btnUndoCanvas">↩️ تراجع عن آخر رسم</button>
    </div>
  </aside>

  <main class="video-workspace">
    <div class="video-container" id="videoContainer">
      <div id="singleView" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center;">
        <video id="mainVideo" preload="metadata" crossorigin="anonymous">
          <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
        </video>
      </div>

      <div id="dualView" class="dual-container" style="display:none;">
        <div class="dual-box">
          <video id="dualVideo1" preload="metadata" crossorigin="anonymous"></video>
        </div>
        <div class="dual-box">
          <video id="dualVideo2" preload="metadata" crossorigin="anonymous"></video>
          <label class="btn btn-primary" for="videoFileInput2" style="position:absolute; top:10px; right:10px; z-index:10;">
            📂 فيديو 2
            <input type="file" id="videoFileInput2" accept="video/*" style="display:none;">
          </label>
        </div>
      </div>
      <canvas id="overlayCanvas"></canvas>
    </div>

    <div class="player-controls">
      <div class="timeline-slider-wrapper">
        <span class="time-display" id="currentTime">00:00.00</span>
        <input type="range" class="timeline-slider" id="seekBar" aria-label="شريط تقدم الفيديو" min="0" value="0" step="0.01">
        <span class="time-display" id="durationTime" style="color:var(--text-mut);">00:00.00</span>
      </div>

      <div class="controls-row">
        <div class="ctrl-group">
          <button class="ctrl-btn" id="btnPrevFrame" title="-1 فريم">⏮️</button>
          <button class="ctrl-btn" id="btnRewind5" title="-5 ثوانٍ">⏪</button>
          <button class="ctrl-btn" id="btnPlayPause" style="background:var(--accent); color:#000; font-weight:bold;">▶</button>
          <button class="ctrl-btn" id="btnForward5" title="+5 ثوانٍ">⏩</button>
          <button class="ctrl-btn" id="btnNextFrame" title="+1 فريم">⏭️</button>

        <div class="ctrl-group">
          <span class="control-label">السرعة:</span>
          <select id="speedSelect" aria-label="سرعة التشغيل" style="background:var(--bg); color:var(--text); border:1px solid var(--border); padding:4px 8px; border-radius:6px; font-weight:bold;">
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x</option>

          <button class="ctrl-btn" id="btnFullscreen" title="ملء الشاشة">⛶</button>

  <aside class="tagging-panel">

      <div class="lead-input"><span>بعد:</span><input type="number" id="postLead" aria-label="بعد" value="5" min="1" max="30"><span>ث</span></div>
    </div>

    <div class="tag-matrix" id="tagMatrix">
      <button class="tag-chip-btn" style="background:#10b981;" data-tag="⚽ هدف">⚽ هدف</button>

      <button class="tag-chip-btn" style="background:#8b5cf6;" data-tag="🧤 تصدي حارس">🧤 تصدي</button>
      <button class="tag-chip-btn" style="background:#f59e0b;" data-tag="⚠️ خطأ">⚠️ خطأ</button>
      <button class="tag-chip-btn" style="background:#eab308;" data-tag="🟨 صفراء">🟨 صفراء</button>
      <button class="tag-chip-btn" style="background:#ef4444;" data-tag="🟥 حمراء">🟥 حمراء</button>
      <button class="tag-chip-btn" style="background:#06b6d4;" data-tag="📐 ركنية">📐 ركنية</button>
      <button class="tag-chip-btn" style="background:#ec4899;" data-tag="🧠 هجوم">🧠 هجوم</button>
    </div>

    <div class="panel-title" style="margin-top:6px;"><span>📊 الإحصائيات</span></div>
    <div class="stats-summary" id="statsChart"><div style="font-size:0.75rem; color:var(--text-mut); text-align:center;">سجّل وسوم للبدء.</div></div>

    <div class="panel-title" style="margin-top:6px;">
      <span>📋 اللقطات (<span id="eventCount">0</span>)</span>
      <button class="btn" id="btnClearEvents" style="padding:2px 8px; font-size:0.75rem;">مسح</button>
    </div>
    <div class="events-list" id="eventsList">
      <div style="color:var(--text-mut); text-align:center; padding:16px; font-size:0.85rem;">اضغط على وسْم لتسجيل لقطة.</div>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="reportModal">
  <div class="modal-box">
    <div class="panel-title"><span>📑 تقرير التحليل التكتيكي</span><button class="btn" id="btnCloseModal">✕</button></div>
    <div id="reportContent" style="margin-top:16px;"></div>
    <div style="margin-top:20px; display:flex; justify-content:flex-end;"><button class="btn btn-primary" onclick="window.print()">🖨️ طباعة PDF</button></div>
  </div>
</div>

<script>
const video = document.getElementById("mainVideo");
const dualVideo1 = document.getElementById("dualVideo1");
const dualVideo2 = document.getElementById("dualVideo2");
const canvas = document.getElementById("overlayCanvas");
const ctx = canvas.getContext("2d");

let currentTool = "select", currentColor = "#ef4444", currentLineWidth = 4, isDrawing = false, showTacticalGrid = false, isDualMode = false;
let startX = 0, startY = 0, drawingHistory = [], events = [];

const toast = document.getElementById("toast");
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2500);
}

function resizeCanvas() {
  canvas.width = video.clientWidth;
  canvas.height = video.clientHeight;
  redrawCanvas();
}
window.addEventListener("resize", resizeCanvas);
video.addEventListener("loadeddata", resizeCanvas);

function formatTime(sec) {
  if (isNaN(sec)) return "00:00.00";
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60), ms = Math.floor((sec % 1) * 100);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms).padStart(2,'0')}`;
}

video.addEventListener("timeupdate", () => {
  document.getElementById("currentTime").textContent = formatTime(video.currentTime);
  document.getElementById("seekBar").value = video.currentTime;
});
video.addEventListener("loadedmetadata", () => {
  document.getElementById("durationTime").textContent = formatTime(video.duration);
  document.getElementById("seekBar").max = video.duration;
  resizeCanvas();
});

document.getElementById("btnPlayPause").onclick = () => {
  if (video.paused) { video.play(); if(isDualMode) dualVideo2.play(); document.getElementById("btnPlayPause").textContent = "⏸️"; }
  else { video.pause(); if(isDualMode) dualVideo2.pause(); document.getElementById("btnPlayPause").textContent = "▶"; }
};

document.getElementById("seekBar").oninput = (e) => {
  const t = parseFloat(e.target.value);
  video.currentTime = t; if(isDualMode) dualVideo2.currentTime = t;
};

document.getElementById("videoFileInput").onchange = (e) => {
  if (e.target.files[0]) {
    const url = URL.createObjectURL(e.target.files[0]);
    video.src = url; dualVideo1.src = url; showToast("تم فتح الفيديو 🎬");
  }
};

document.getElementById("videoFileInput2").onchange = (e) => {
  if (e.target.files[0]) { dualVideo2.src = URL.createObjectURL(e.target.files[0]); showToast("تم فتح الفيديو الثاني 🎦"); }
};

document.getElementById("btnLiveCamera").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    video.srcObject = stream; video.play(); showToast("الكاميرا المباشرة تعمل 📷");
  } catch(e) { showToast("تعذر تشغيل الكاميرا."); }
};

document.getElementById("btnDualMode").onclick = () => {
  isDualMode = !isDualMode;
  document.getElementById("singleView").style.display = isDualMode ? "none" : "flex";
  document.getElementById("dualView").style.display = isDualMode ? "flex" : "none";
  if(isDualMode) { dualVideo1.src = video.src; showToast("مقارنة شاشتين مفعلة 🎦"); }
  else showToast("الوضع الفردي مفعل");
};

document.getElementById("btnSnapshot").onclick = () => {
  const sc = document.createElement("canvas");
  sc.width = video.videoWidth || canvas.width; sc.height = video.videoHeight || canvas.height;
  const sCtx = sc.getContext("2d");
  sCtx.drawImage(video, 0, 0, sc.width, sc.height);
  sCtx.drawImage(canvas, 0, 0, sc.width, sc.height);
  const link = document.createElement("a");
  link.download = `snapshot-${Date.now()}.png`; link.href = sc.toDataURL(); link.click();
  showToast("تم تحميل اللقطة HD 📸");
};

document.querySelectorAll(".tool-btn[data-tool]").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".tool-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active"); currentTool = btn.dataset.tool;
  };
});

document.querySelectorAll(".color-dot").forEach(dot => {
  dot.onclick = () => {
    document.querySelectorAll(".color-dot").forEach(d => d.classList.remove("active"));
    dot.classList.add("active"); currentColor = dot.dataset.color;
  };
});

document.getElementById("lineWidthRange").oninput = (e) => {
  currentLineWidth = parseInt(e.target.value);
  document.getElementById("lineWidthVal").textContent = currentLineWidth + "px";
};

document.getElementById("btnToggleGrid").onclick = () => {
  showTacticalGrid = !showTacticalGrid;
  document.getElementById("btnToggleGrid").classList.toggle("active", showTacticalGrid);
  redrawCanvas(); showToast(showTacticalGrid ? "شبكة الملعب مفعلة ⚽" : "إخفاء الشبكة");
};

canvas.onmousedown = (e) => {
  if (currentTool === "select") return;
  isDrawing = true;
  const rect = canvas.getBoundingClientRect();
  startX = e.clientX - rect.left; startY = e.clientY - rect.top;
  if (currentTool === "pen") { ctx.beginPath(); ctx.moveTo(startX, startY); }
};

canvas.onmousemove = (e) => {
  if (!isDrawing || currentTool === "select") return;
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  if (currentTool === "pen") {
    ctx.strokeStyle = currentColor; ctx.lineWidth = currentLineWidth; ctx.lineCap = "round";
    ctx.lineTo(cx, cy); ctx.stroke();
  } else {
    redrawCanvas(); drawShape(startX, startY, cx, cy);
  }
};

canvas.onmouseup = (e) => {
  if (!isDrawing) return; isDrawing = false;
  const rect = canvas.getBoundingClientRect();
  if (currentTool !== "pen") drawShape(startX, startY, e.clientX - rect.left, e.clientY - rect.top);
  saveCanvasState();
};

function drawShape(sx, sy, ex, ey) {
  ctx.strokeStyle = currentColor; ctx.lineWidth = currentLineWidth; ctx.fillStyle = currentColor;
  if (currentTool === "arrow") {
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    const angle = Math.atan2(ey - sy, ex - sx);
    ctx.beginPath(); ctx.moveTo(ex, ey);
    ctx.lineTo(ex - 15 * Math.cos(angle - Math.PI / 6), ey - 15 * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(ex - 15 * Math.cos(angle + Math.PI / 6), ey - 15 * Math.sin(angle + Math.PI / 6));
    ctx.fill();
  } else if (currentTool === "rect") { ctx.strokeRect(sx, sy, ex - sx, ey - sy); }
  else if (currentTool === "circle") {
    const r = Math.hypot(ex - sx, ey - sy);
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, 2 * Math.PI); ctx.stroke();
  } else if (currentTool === "spotlight") {
    ctx.save(); ctx.fillStyle = "rgba(0,0,0,0.65)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const r = Math.hypot(ex - sx, ey - sy); ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, 2 * Math.PI); ctx.fill(); ctx.restore();
  } else if (currentTool === "angle") {
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    const deg = Math.round(Math.abs(Math.atan2(ey - sy, ex - sx) * 180 / Math.PI));
    ctx.font = "bold 16px Cairo"; ctx.fillText(`${deg}°`, ex + 10, ey);
  }
}

function drawGrid() {
  const w = canvas.width, h = canvas.height;
  ctx.save(); ctx.strokeStyle = "rgba(63, 191, 133, 0.35)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, h / 3); ctx.lineTo(w, h / 3);
  ctx.moveTo(0, (2 * h) / 3); ctx.lineTo(w, (2 * h) / 3);
  for (let i = 1; i < 5; i++) { ctx.moveTo((i * w) / 5, 0); ctx.lineTo((i * w) / 5, h); }
  ctx.stroke(); ctx.restore();
}

function saveCanvasState() { drawingHistory.push(ctx.getImageData(0, 0, canvas.width, canvas.height)); }
function redrawCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (showTacticalGrid) drawGrid();
  if (drawingHistory.length) ctx.putImageData(drawingHistory[drawingHistory.length - 1], 0, 0);
}

document.getElementById("btnClearCanvas").onclick = () => { drawingHistory = []; redrawCanvas(); showToast("تم مسح الرسوم"); };
document.getElementById("btnUndoCanvas").onclick = () => { drawingHistory.pop(); redrawCanvas(); };

document.getElementById("tagMatrix").onclick = (e) => {
  const btn = e.target.closest("[data-tag]"); if (!btn) return;
  const tagLabel = btn.dataset.tag, color = btn.style.backgroundColor;
  const pre = parseFloat(document.getElementById("preLead").value) || 5;
  const post = parseFloat(document.getElementById("postLead").value) || 5;
  const now = video.currentTime;
  events.push({ id: Date.now(), tag: tagLabel, color, startTime: Math.max(0, now - pre), endTime: Math.min(video.duration || now + post, now + post) });
  renderEvents(); renderStatsChart(); showToast(`تم وسم: ${tagLabel}`);
};

function renderEvents() {
  document.getElementById("eventCount").textContent = events.length;
  const list = document.getElementById("eventsList");
  if (!events.length) { list.innerHTML = `<div style="color:var(--text-mut); text-align:center; padding:16px;">لا توجد لقطات.</div>`; return; }
  list.innerHTML = events.slice().reverse().map(ev => `
    <div class="event-card" onclick="video.currentTime = ${ev.startTime}; video.play();">
      <div class="event-info">
        <span class="event-tag-title"><span style="color:${ev.color};">●</span> ${ev.tag}</span>
        <span class="event-time">${formatTime(ev.startTime)}</span>
      </div>
      <button class="event-del" onclick="event.stopPropagation(); events = events.filter(x => x.id !== ${ev.id}); renderEvents(); renderStatsChart();">✕</button>
    </div>
  `).join("");
}

function renderStatsChart() {
  const chart = document.getElementById("statsChart");
  if (!events.length) { chart.innerHTML = `<div style="font-size:0.75rem; color:var(--text-mut); text-align:center;">سجّل وسوم للبدء.</div>`; return; }
  const counts = {}; events.forEach(e => counts[e.tag] = (counts[e.tag] || 0) + 1);
  chart.innerHTML = Object.keys(counts).map(tag => {
    const c = counts[tag], pct = Math.round((c / events.length) * 100);
    return `<div class="stat-row"><div class="stat-header"><span>${tag}</span><span>${c} (${pct}%)</span></div><div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${pct}%;"></div></div></div>`;
  }).join("");
}

document.getElementById("btnClearEvents").onclick = () => { events = []; renderEvents(); renderStatsChart(); showToast("تم مسح اللقطات"); };

document.getElementById("btnExportReport").onclick = () => {
  const modal = document.getElementById("reportModal"), content = document.getElementById("reportContent");
  content.innerHTML = `<p><b>إجمالي اللقطات:</b> ${events.length}</p><ul>${events.map(e => `<li><b>${e.tag}</b>: ${formatTime(e.startTime)}</li>`).join("")}</ul>`;
  modal.classList.add("open");
};
document.getElementById("btnCloseModal").onclick = () => document.getElementById("reportModal").classList.remove("open");
</script>
</body>
