<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>video ANALYS DZ | أداة تحليل الفيديو الاحترافية 🎬</title>
<meta name="description" content="أداة تحليل الفيديو الاحترافية LiveTag Pro، الرسم التكتيكي، وتوسيم اللقطات للمدربين ومحللي الأداء.">
<meta name="theme-color" content="#0f5b3a">

<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0b1310;
  --panel: #14221c;
  --accent: #3fbf85;
  --text: #f1f5f9;
  --text-mut: #94a3b8;
  --border: #243d31;
  --red: #ef4444;
  box-sizing: border-box;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: 'Cairo', system-ui, sans-serif;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

a { color: inherit; text-decoration: none; }

header {
  height: 56px;
  background: var(--panel);
  border-bottom: 2px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; position: relative; z-index: 50;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 800; font-size: 1.05rem; color: #fff;
}
.brand-logo {
  width: 34px; height: 34px; border-radius: 8px;
  background: var(--accent); color: #000;
  display: grid; place-items: center; font-size: 1.2rem;
}
.hdr-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn {
  background: #1d3128; color: var(--text); border: 1px solid var(--border);
  padding: 6px 12px; border-radius: 8px; font-family: inherit;
  font-size: 0.82rem; font-weight: 700; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s;
}
.btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }
.btn-primary { background: var(--accent); color: #000; border-color: var(--accent); }

.studio {
  display: grid;
  grid-template-columns: 280px 1fr 320px;
  height: calc(100vh - 56px);
  overflow: hidden;
}
@media (max-width: 1000px) {
  .studio { grid-template-columns: 1fr; grid-template-rows: auto auto auto; height: auto; }
}

.tools-panel, .tagging-panel {
  background: var(--panel); border: 2px solid var(--border);
  padding: 14px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto;
}
.panel-title {
  font-size: 0.9rem; font-weight: 800; color: var(--accent);
  border-bottom: 1px solid var(--border); padding-bottom: 6px; margin: 0;
  display: flex; align-items: center; justify-content: space-between;
}
.tool-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.tool-btn {
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  padding: 8px; border-radius: 8px; font-family: inherit; font-size: 0.8rem; font-weight: 700;
  cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.tool-btn:hover, .tool-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

.video-workspace {
  display: flex; flex-direction: column; background: #000; position: relative; overflow: hidden;
}
.video-container {
  flex: 1; position: relative; display: flex; align-items: center; justify-content: center; background: #050a08; overflow: hidden;
}
video { max-width: 100%; max-height: 100%; display: block; }
canvas#overlayCanvas {
  position: absolute; top: 0; left: 0; pointer-events: auto; cursor: crosshair;
}

.player-controls {
  background: var(--panel); border-top: 2px solid var(--border);
  padding: 10px 16px; display: flex; flex-direction: column; gap: 8px;
}
.timeline-slider-wrapper { display: flex; align-items: center; gap: 10px; }
.timeline-slider { flex: 1; accent-color: var(--accent); cursor: pointer; }
.time-display { font-family: monospace; font-size: 0.85rem; font-weight: 700; color: var(--accent); }

.controls-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ctrl-btn {
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center;
  font-size: 1rem; cursor: pointer;
}
.ctrl-btn:hover { background: var(--accent); color: #000; }

.tag-matrix { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.tag-chip-btn {
  padding: 10px; border-radius: 8px; border: none; color: #fff;
  font-family: inherit; font-weight: 800; font-size: 0.82rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 4px;
}
.events-list { display: flex; flex-direction: column; gap: 6px; max-height: 250px; overflow-y: auto; }
.event-card {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; display: flex; align-items: center; justify-content: space-between; gap: 6px; cursor: pointer;
}
.event-card:hover { border-color: var(--accent); }

.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: #1e293b; color: #fff; padding: 10px 20px; border-radius: 99px;
  font-weight: 700; font-size: 0.9rem; z-index: 1000; opacity: 0; transition: all 0.3s;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo">🎬</div>
    <div>video ANALYS DZ <small style="display:block; font-size:0.68rem; color:var(--accent);">Pro Studio 🇩🇿</small></div>
  </div>
  <div class="hdr-actions">
    <label class="btn btn-primary" for="videoFileInput">
      📂 فتح فيديو محلي
      <input type="file" id="videoFileInput" accept="video/*" style="display:none;">
    </label>
    <a class="btn" href="https://github.com/benabdallahhouari652-svg/video_analyzer-1-/releases/latest/download/app-release.apk" target="_blank">⬇️ تحميل تطبيق APK</a>
    <a class="btn" href="index.html">← المتجر</a>
  </div>
</header>

<div class="studio">
  <aside class="tools-panel">
    <div class="panel-title"><span>🎨 أدوات الرسم</span><button class="btn" id="btnClearCanvas" style="padding:2px 8px; font-size:0.75rem;">مسح</button></div>
    <div class="tool-grid">
      <button class="tool-btn active" data-tool="select"><span>👆</span>تأشير</button>
      <button class="tool-btn" data-tool="pen"><span>✏️</span>قلم حر</button>
      <button class="tool-btn" data-tool="arrow"><span>➡️</span>سهم</button>
      <button class="tool-btn" data-tool="circle"><span>⭕</span>دائرة</button>
      <button class="tool-btn" data-tool="rect"><span>⏹️</span>مستطيل</button>
      <button class="tool-btn" data-tool="spotlight"><span>💡</span>تركيز</button>
    </div>
    <div style="margin-top:12px;">
      <div style="font-size:0.78rem; color:var(--text-mut); margin-bottom:4px;">لون القلم:</div>
      <div style="display:flex; gap:8px;">
        <div style="width:24px; height:24px; border-radius:50%; background:#ef4444; cursor:pointer;" onclick="currentColor='#ef4444'"></div>
        <div style="width:24px; height:24px; border-radius:50%; background:#f59e0b; cursor:pointer;" onclick="currentColor='#f59e0b'"></div>
        <div style="width:24px; height:24px; border-radius:50%; background:#10b981; cursor:pointer;" onclick="currentColor='#10b981'"></div>
        <div style="width:24px; height:24px; border-radius:50%; background:#ffffff; cursor:pointer;" onclick="currentColor='#ffffff'"></div>
      </div>
    </div>
  </aside>

  <main class="video-workspace">
    <div class="video-container" id="videoContainer">
      <video id="mainVideo" preload="metadata" crossorigin="anonymous">
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
      </video>
      <canvas id="overlayCanvas"></canvas>
    </div>

    <div class="player-controls">
      <div class="timeline-slider-wrapper">
        <span class="time-display" id="currentTime">00:00.00</span>
        <input type="range" class="timeline-slider" id="seekBar" aria-label="شريط تقدم الفيديو" min="0" value="0" step="0.01">
        <span class="time-display" id="durationTime" style="color:var(--text-mut);">00:00.00</span>
      </div>

      <div class="controls-row">
        <div class="ctrl-group" style="display:flex; gap:6px;">
          <button class="ctrl-btn" id="btnRewind5">⏪</button>
          <button class="ctrl-btn" id="btnPlayPause" style="background:var(--accent); color:#000;">▶</button>
          <button class="ctrl-btn" id="btnForward5">⏩</button>
        </div>
      </div>
    </div>
  </main>

  <aside class="tagging-panel">
    <div class="panel-title"><span>🏷️ لوحة الوسوم</span></div>
    <div class="tag-matrix" id="tagMatrix">
      <button class="tag-chip-btn" style="background:#10b981;" data-tag="⚽ هدف">⚽ هدف</button>
      <button class="tag-chip-btn" style="background:#3b82f6;" data-tag="🎯 تمريرة">🎯 تمريرة</button>
      <button class="tag-chip-btn" style="background:#8b5cf6;" data-tag="🧤 تصدي">🧤 تصدي</button>
      <button class="tag-chip-btn" style="background:#ef4444;" data-tag="⚠️ خطأ">⚠️ خطأ</button>
    </div>

    <div class="panel-title" style="margin-top:10px;"><span>📋 اللقطات المجلوبة</span></div>
    <div class="events-list" id="eventsList">
      <div style="color:var(--text-mut); text-align:center; padding:12px; font-size:0.85rem;">اختر وسماً لتسجيل اللقطة.</div>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script>
const video = document.getElementById("mainVideo");
const canvas = document.getElementById("overlayCanvas");
const ctx = canvas.getContext("2d");

let currentTool = "select", currentColor = "#ef4444", isDrawing = false, startX = 0, startY = 0, events = [];
const toast = document.getElementById("toast");

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2200);
}

function resizeCanvas() {
  canvas.width = video.clientWidth;
  canvas.height = video.clientHeight;
}
window.addEventListener("resize", resizeCanvas);
video.addEventListener("loadeddata", resizeCanvas);

video.addEventListener("timeupdate", () => {
  document.getElementById("currentTime").textContent = formatTime(video.currentTime);
  document.getElementById("seekBar").value = video.currentTime;
});
video.addEventListener("loadedmetadata", () => {
  document.getElementById("durationTime").textContent = formatTime(video.duration);
  document.getElementById("seekBar").max = video.duration;
  resizeCanvas();
});

function formatTime(sec) {
  if (isNaN(sec)) return "00:00.00";
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

document.getElementById("btnPlayPause").onclick = () => {
  if (video.paused) { video.play(); document.getElementById("btnPlayPause").textContent = "⏸️"; }
  else { video.pause(); document.getElementById("btnPlayPause").textContent = "▶"; }
};

document.getElementById("seekBar").oninput = (e) => video.currentTime = parseFloat(e.target.value);
document.getElementById("btnRewind5").onclick = () => video.currentTime = Math.max(0, video.currentTime - 5);
document.getElementById("btnForward5").onclick = () => video.currentTime = Math.min(video.duration, video.currentTime + 5);

document.getElementById("videoFileInput").onchange = (e) => {
  if (e.target.files[0]) {
    video.src = URL.createObjectURL(e.target.files[0]);
    showToast("تم فتح الفيديو بنجاح 📂");
  }
};

document.querySelectorAll(".tool-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".tool-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active"); currentTool = btn.dataset.tool;
  };
});

canvas.onmousedown = (e) => {
  if (currentTool === "select") return;
  isDrawing = true;
  const rect = canvas.getBoundingClientRect();
  startX = e.clientX - rect.left; startY = e.clientY - rect.top;
  if (currentTool === "pen") { ctx.beginPath(); ctx.moveTo(startX, startY); }
};

canvas.onmousemove = (e) => {
  if (!isDrawing || currentTool === "select") return;
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  if (currentTool === "pen") {
    ctx.strokeStyle = currentColor; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.lineTo(cx, cy); ctx.stroke();
  }
};

canvas.onmouseup = (e) => {
  if (!isDrawing) return; isDrawing = false;
  const rect = canvas.getBoundingClientRect();
  const ex = e.clientX - rect.left, ey = e.clientY - rect.top;
  if (currentTool === "circle") {
    const r = Math.hypot(ex - startX, ey - startY);
    ctx.strokeStyle = currentColor; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(startX, startY, r, 0, 2 * Math.PI); ctx.stroke();
  } else if (currentTool === "rect") {
    ctx.strokeStyle = currentColor; ctx.lineWidth = 4;
    ctx.strokeRect(startX, startY, ex - startX, ey - startY);
  }
};

document.getElementById("btnClearCanvas").onclick = () => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  showToast("تم مسح الرسوم");
};

document.getElementById("tagMatrix").onclick = (e) => {
  const btn = e.target.closest("[data-tag]"); if (!btn) return;
  events.push({ id: Date.now(), tag: btn.dataset.tag, time: video.currentTime });
  renderEvents(); showToast(`تم تسجيل: ${btn.dataset.tag}`);
};

function renderEvents() {
  const list = document.getElementById("eventsList");
  if (!events.length) { list.innerHTML = `<div style="color:var(--text-mut); text-align:center; padding:12px; font-size:0.85rem;">اختر وسماً لتسجيل اللقطة.</div>`; return; }
  list.innerHTML = events.slice().reverse().map(ev => `
    <div class="event-card" onclick="video.currentTime = ${ev.time}; video.play();">
      <span><b>${ev.tag}</b> (${formatTime(ev.time)})</span>
      <button style="background:none; border:none; color:var(--red); font-weight:bold; cursor:pointer;" onclick="event.stopPropagation(); events = events.filter(x => x.id !== ${ev.id}); renderEvents();">✕</button>
    </div>
  `).join("");
}
</script>
</body>
</html>
