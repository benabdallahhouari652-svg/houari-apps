<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EA SPORTS FIFA 3D | لعبة حارس المرمى بأسلوب الفيفا 🎮⚽</title>
<meta name="description" content="محاكي حراسة المرمى ثلاثي الأبعاد 3D بأسلوب FIFA و EA SPORTS FC، رسوميات ملعب احترافية وهتافات الجماهير.">
<meta name="theme-color" content="#0f5b3a">

<!-- PWA Manifest & Fonts -->
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<!-- Three.js 3D Engine -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
:root {
  --fifa-dark: #070e17;
  --fifa-gold: #f59e0b;
  --fifa-green: #10b981;
  --fifa-red: #ef4444;
  --fifa-card: #0f172a;
  --fifa-border: #1e293b;
  box-sizing: border-box;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0;
  background: var(--fifa-dark);
  color: #fff;
  font-family: 'Cairo', system-ui, sans-serif;
  text-align: center;
  overflow-x: hidden;
  user-select: none;
}

/* FIFA Top Header Bar */
header {
  background: linear-gradient(90deg, #092e1d 0%, #0f5b3a 50%, #092e1d 100%);
  padding: 10px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 3px solid var(--fifa-gold);
  box-shadow: 0 4px 15px rgba(0,0,0,0.6);
}
.fifa-logo {
  font-weight: 900;
  font-size: 1.15rem;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.fifa-badge {
  background: var(--fifa-gold);
  color: #000;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 0.75rem;
  font-weight: 900;
}

main {
  max-width: 950px;
  margin: 0 auto;
  padding: 14px;
}

/* FIFA Scoreboard HUD */
.fifa-hud {
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: rgba(15, 23, 42, 0.9);
  backdrop-filter: blur(10px);
  border: 2px solid rgba(245, 158, 11, 0.4);
  border-radius: 16px;
  padding: 12px 20px;
  margin-bottom: 14px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.7);
}
.fifa-hud-item {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.fifa-hud-val {
  font-size: 1.3rem;
  font-weight: 900;
  color: var(--fifa-gold);
}
.fifa-hud-lbl {
  font-size: 0.75rem;
  color: #94a3b8;
  font-weight: 700;
}

/* 3D Game Container */
.game-3d-container {
  width: 100%;
  height: 500px;
  border: 3px solid var(--fifa-gold);
  border-radius: 20px;
  overflow: hidden;
  position: relative;
  background: #000;
  box-shadow: 0 15px 40px rgba(0,0,0,0.9);
}

#canvas3d {
  width: 100%;
  height: 100%;
  display: block;
}

.fifa-aim-target {
  position: absolute;
  width: 44px;
  height: 44px;
  border: 3px solid var(--fifa-gold);
  border-radius: 50%;
  box-shadow: 0 0 15px var(--fifa-gold);
  pointer-events: none;
  transform: translate(-50%, -50%);
  display: none;
  z-index: 5;
  animation: pulse 1s infinite alternate;
}
@keyframes pulse {
  0% { transform: translate(-50%, -50%) scale(0.9); }
  100% { transform: translate(-50%, -50%) scale(1.15); }
}

.btn-fifa {
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #000;
  border: none;
  padding: 12px 28px;
  border-radius: 12px;
  font-family: inherit;
  font-weight: 900;
  font-size: 1.1rem;
  cursor: pointer;
  margin-top: 14px;
  box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
  transition: transform 0.2s, box-shadow 0.2s;
}
.btn-fifa:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(245, 158, 11, 0.6);
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-weight: 700;
  font-size: 0.9rem;
  z-index: 1000;
  opacity: 0;
  transition: all 0.3s;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
</style>
</head>
<body>

<header>
  <div class="fifa-logo">
    🎮 EA SPORTS FC <span class="fifa-badge">FIFA 3D</span>
  </div>
  <a href="index.html" style="color:#fff; font-weight:700; text-decoration:none;">← المتجر</a>
</header>

<main>
  <!-- FIFA HUD Board -->
  <div class="fifa-hud">
    <div class="fifa-hud-item">
      <span class="fifa-hud-lbl">النقاط (SCORE)</span>
      <span class="fifa-hud-val" id="scoreVal">0</span>
    </div>
    <div class="fifa-hud-item">
      <span class="fifa-hud-lbl">المحاولات (LIVES)</span>
      <span class="fifa-hud-val" id="livesVal" style="color:var(--fifa-red);">💖💖💖</span>
    </div>
    <div class="fifa-hud-item">
      <span class="fifa-hud-lbl">الأعلى (BEST)</span>
      <span class="fifa-hud-val" id="highVal">0</span>
    </div>
  </div>

  <!-- 3D Stadium Canvas Box -->
  <div class="game-3d-container" id="gameContainer">
    <div class="fifa-aim-target" id="fifaAim"></div>
    <div id="canvas3d"></div>
  </div>

  <button class="btn-fifa" id="btnStartFIFA">⚽ بدء ركلات الجزاء 3D (FIFA STYLE)</button>
</main>

<div class="toast" id="toast"></div>

<script>
let scene, camera, renderer;
let ballMesh, gloveMesh, goalPostGroup, pitchMesh;
let isPlaying = false;
let score = 0;
let lives = 3;
let highScore = localStorage.getItem("gk_game_fifa_highscore") || 0;

let ballVelocity = { x: 0, y: 0, z: 0 };
let ballPos = { x: 0, y: 0.3, z: -18 };
let targetAim = { x: 0, y: 1.5 };

document.getElementById("highVal").textContent = highScore;

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

// Play FIFA Sound Synthetic Effects
function playFifaSound(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    if (type === 'save') {
      osc.frequency.setValueAtTime(440, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.2);
    } else if (type === 'goal') {
      osc.frequency.setValueAtTime(200, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.4);
      gain.gain.setValueAtTime(0.4, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.4);
    }
  } catch(e) {}
}

function initFIFA3D() {
  const container = document.getElementById("canvas3d");
  const w = container.clientWidth;
  const h = container.clientHeight;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x06111a);
  scene.fog = new THREE.Fog(0x06111a, 12, 40);

  camera = new THREE.PerspectiveCamera(55, w / h, 0.1, 100);
  camera.position.set(0, 1.7, 3.8); // FIFA Goalkeeper Perspective View

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(w, h);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  // FIFA Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
  scene.add(ambientLight);

  // Stadium Floodlights
  const floodLight1 = new THREE.SpotLight(0xffffff, 1.2);
  floodLight1.position.set(-15, 25, -10);
  floodLight1.castShadow = true;
  scene.add(floodLight1);

  const floodLight2 = new THREE.SpotLight(0x3fbf85, 0.8);
  floodLight2.position.set(15, 25, -10);
  scene.add(floodLight2);

  // FIFA Turf Pitch (Striped Grass)
  const pitchGeo = new THREE.PlaneGeometry(28, 50);
  const pitchMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.7 });
  pitchMesh = new THREE.Mesh(pitchGeo, pitchMat);
  pitchMesh.rotation.x = -Math.PI / 2;
  pitchMesh.position.z = -15;
  pitchMesh.receiveShadow = true;
  scene.add(pitchMesh);

  // FIFA Penalty Box Lines
  const lineGeo = new THREE.PlaneGeometry(7.32, 0.1);
  const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const goalLine = new THREE.Mesh(lineGeo, lineMat);
  goalLine.rotation.x = -Math.PI / 2;
  goalLine.position.set(0, 0.01, 0);
  scene.add(goalLine);

  // 3D Goal Posts (FIFA Standard)
  goalPostGroup = new THREE.Group();
  const postMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.4, roughness: 0.2 });

  const leftPost = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 2.44), postMat);
  leftPost.position.set(-3.66, 1.22, 0);
  leftPost.castShadow = true;
  goalPostGroup.add(leftPost);

  const rightPost = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 2.44), postMat);
  rightPost.position.set(3.66, 1.22, 0);
  rightPost.castShadow = true;
  goalPostGroup.add(rightPost);

  const crossbar = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 7.56), postMat);
  crossbar.rotation.z = Math.PI / 2;
  crossbar.position.set(0, 2.44, 0);
  crossbar.castShadow = true;
  goalPostGroup.add(crossbar);

  scene.add(goalPostGroup);

  // FIFA 3D Soccer Ball
  const ballGeo = new THREE.SphereGeometry(0.32, 32, 32);
  const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
  ballMesh = new THREE.Mesh(ballGeo, ballMat);
  ballMesh.position.set(ballPos.x, ballPos.y, ballPos.z);
  ballMesh.castShadow = true;
  scene.add(ballMesh);

  // FIFA Goalkeeper Glove (Dual Gloves)
  const gloveGeo = new THREE.BoxGeometry(1.4, 0.9, 0.2);
  const gloveMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.2, metalness: 0.3 });
  gloveMesh = new THREE.Mesh(gloveGeo, gloveMat);
  gloveMesh.position.set(0, 1.22, 1);
  scene.add(gloveMesh);

  // Mouse & Touch Controls
  window.addEventListener("mousemove", onMouseMove);
  window.addEventListener("touchmove", onTouchMove);

  animate();
}

function onMouseMove(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  gloveMesh.position.x = x * 4.2;
  gloveMesh.position.y = Math.max(0.4, (y + 1) * 1.6);
}

function onTouchMove(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  const x = ((e.touches[0].clientX - rect.left) / rect.width) * 2 - 1;
  const y = -((e.touches[0].clientY - rect.top) / rect.height) * 2 + 1;
  gloveMesh.position.x = x * 4.2;
  gloveMesh.position.y = Math.max(0.4, (y + 1) * 1.6);
}

function resetFifaShot() {
  ballPos = { x: 0, y: 0.3, z: -18 };

  // FIFA Aim Target Ring Location
  targetAim.x = (Math.random() - 0.5) * 6.5;
  targetAim.y = 0.5 + Math.random() * 1.8;

  const speed = 0.42 + Math.random() * 0.18;
  ballVelocity = {
    x: (targetAim.x - ballPos.x) * 0.022,
    y: (targetAim.y - ballPos.y) * 0.022,
    z: speed
  };

  // Show Target Indicator
  const aimElement = document.getElementById("fifaAim");
  aimElement.style.display = "block";
  aimElement.style.left = `${(targetAim.x / 4.2 + 0.5) * 100}%`;
  aimElement.style.top = `${(1 - targetAim.y / 2.5) * 100}%`;
}

function updateGameLogic() {
  if (!isPlaying) return;

  // Move 3D FIFA Ball
  ballPos.x += ballVelocity.x;
  ballPos.y += ballVelocity.y;
  ballPos.z += ballVelocity.z;

  ballMesh.position.set(ballPos.x, ballPos.y, ballPos.z);
  ballMesh.rotation.x += 0.15;

  // FIFA Save Detection
  if (ballPos.z >= 0.8 && ballPos.z <= 1.3) {
    const dist = Math.hypot(ballPos.x - gloveMesh.position.x, ballPos.y - gloveMesh.position.y);
    if (dist < 1.1) {
      score += 1;
      document.getElementById("scoreVal").textContent = score;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem("gk_game_fifa_highscore", highScore);
        document.getElementById("highVal").textContent = highScore;
      }
      playFifaSound('save');
      showToast("🧤 تصدي خيالي بأسلوب الفيفا! +1");
      resetFifaShot();
      return;
    }
  }

  // Goal Scored
  if (ballPos.z > 2.2) {
    playFifaSound('goal');
    lives--;
    updateLivesDisplay();
    if (lives <= 0) {
      isPlaying = false;
      showToast(`انتهت المباراة! مجموع نقاطك بالـ FIFA: ${score}`);
    } else {
      showToast("⚽ هدف في المرمى!");
      resetFifaShot();
    }
  }
}

function updateLivesDisplay() {
  let str = "";
  for (let i = 0; i < lives; i++) str += "💖";
  document.getElementById("livesVal").textContent = str || "❌";
}

function animate() {
  requestAnimationFrame(animate);
  updateGameLogic();
  renderer.render(scene, camera);
}

document.getElementById("btnStartFIFA").onclick = () => {
  score = 0;
  lives = 3;
  isPlaying = true;
  document.getElementById("scoreVal").textContent = 0;
  updateLivesDisplay();
  resetFifaShot();
  showToast("بدأت ركلات الجزاء بأسلوب EA SPORTS FIFA 3D! ⚽");
};

// Auto Start
if (typeof THREE !== "undefined") {
  initFIFA3D();
}
</script>
</body>
</html>
